# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
# single slot (no /metadata, no gsid): its builds come from the computer installer of the guide
tag=play6-{version}
image=lumen-os-play6-{version}-nogms-system.img
certs=installer/certs/play6/ota.x509.pem
# The way back (Settings > About > Back to the XGIMI system, apps/core/lumen-about): the file name the XGIMI recovery
# USB stick needs, the official XGIMI files (version:size in bytes:address, sizes read from XGIMI's server) and per
# model the stock versions with the official version each goes back with (docs/install/play6/en.md, Back to stock).
restore_file=XGIMI_DRAGONHEALTHY_XN03C.bin
restore_files=v1.7.116:2051543712:https://product-library.static.xgimi.com/firmware/release/MTK9270/dayao/MTK9270_APHRODIT_1.7.116_20251125-162039/XGIMI_DRAGONHEALTHY_XN03C.bin v1.8.127:2115834528:https://product-library.static.xgimi.com/firmware/release/MTK9270/dayao/MTK9270_APHRODIT_1.8.127_20260410-175145/XGIMI_DRAGONHEALTHY_XN03C.bin
restore_stock=G0058:v1.7.116>v1.7.116,v1.8.127>v1.8.127
