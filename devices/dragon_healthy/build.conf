# Lumen OS build descriptor: XGIMI Play 6 (dragon_healthy, G0058). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/dragon_healthy/image/steps.tsv, run as root in the lineage-builder container
# of the build host (runner) over the base build in /out (base_export.sh id must equal the Mac's base_id.txt).
# built: outputs of tools/play6/build_test.sh steps 1-5 on the Mac (APKs on the Play 6 keys, sign_play6.py base and
# pinned), staged flat into ~/<remote_dir>/in next to the repository files; never a key. Also the keystone
# SurfaceFlinger build/play6/sf/surfaceflinger (lineage/play6_sf_build.sh over this base, pinned by SF_SHA below).
# The screen mirroring receiver (LumenMiracast, Java only) and its Wi-Fi Direct TV overlay are built from source
# with the Play 6 key, AirPlay is the pinned release APK re-signed (its armeabi-v7a library is in it already).
codename=dragon_healthy
model=G0058
keys=play6
ota_channel=none
base=dir {BASE}
base_pin=none
apps=Play6Projector Play6FrameworkOverlay Play6TvSettingsOverlay Z9xHome Z9xTvInput Z9xLineagePlatformOverlay Z9xSetup LumenBridge Play6Updater LumenMiracast LumenWifiP2pOverlay Z9xAirPlay
props=overlay/play6/product_prop.txt
overlays=overlay/v1/privapp-permissions-z9xhome.xml overlay/v1/privapp-permissions-z9xsetup.xml overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/z9x-airplay-default-permissions.xml overlay/v1/z9x-home-default-permissions.xml overlay/v1/z9x-projector-default-permissions.xml overlay/v1/z9x-sysconfig-nogms.xml overlay/v1/bootanimation.zip overlay/v1/idc/Vendor_000d_Product_3841.idc overlay/play6/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl overlay/play6/play6_compat.rc overlay/play6/play6_base.rc overlay/play6/play6_perf.rc overlay/play6/lumen_gapps.rc overlay/play6/lumen_gapps.sh overlay/v1/z9x_nui.rc overlay/v1/z9x_nui.sh overlay/play6/lumen_recovery.rc overlay/play6/lumen_recovery.sh overlay/debug/z9x_earlylog.rc overlay/debug/z9x_earlylog.sh overlay/play6/earlylog_usb.sh overlay/debug/lumen_escape.rc overlay/debug/lumen_escape.sh overlay/play6/play6_boottiming.rc overlay/play6/play6_boottiming.sh overlay/play6/play6_early_mik.rc devices/_image/debloat_gsi_tv_arm.txt devices/_image/debloat_launcher.txt devices/dragon_healthy/image/debloat.txt
tools=tools/play6/compose.sh tools/play6/dexpreopt_play6.sh tools/play6/check_privapp.py tools/play6/base_export.sh tools/lumen/lumen_checks.py tools/lumen/apkinfo.py devices/dragon_healthy/image/play6_props.py devices/dragon_healthy/image/gms_install.py devices/dragon_healthy/image/ota_certs.py devices/_image/checks/airplay_libs.py
built=build/play6/Play6FrameworkOverlay.apk build/play6/Play6TvSettingsOverlay.apk build/play6/Play6Projector.apk build/play6/signed/Z9xHome.apk build/play6/signed/Z9xTvInput.apk build/play6/signed/Z9xLineagePlatformOverlay.apk build/play6/signed/Z9xSetup.apk build/play6/LumenBridge_projector.apk build/play6/LumenBridge_home.apk build/play6/LumenBridge_setup.apk build/play6/LumenBridge_tvinput.apk build/play6/Play6Updater.apk build/play6/LumenBridge_updater.apk build/play6/LumenMiracast.apk build/play6/LumenWifiP2pOverlay.apk build/play6/signed/Z9xAirPlay.apk build/play6/lumen_play6_ota.x509 base_id.txt base_signed gms build/play6/sf/surfaceflinger
steps=devices/dragon_healthy/image/steps.tsv
host=builder.env
remote_dir=play6-work
runner=docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v {home}/lineage:/src:ro -v {home}/play6-out:/out:ro -v {home}/play6-work:/work lineage-builder
runner_out=/work
variants=test:
fs=ext4
pack=build_image {IMAGE_INFO} /src
pack_tool=/out/host/linux-x86/bin
version=test:t[0-9].*
options=--diag:diag --usb-adb:usbadb --no-dexpreopt:nodex --exp:expall --exp=:exp --gms:gms --ota:ota
samples=t40
tag={v}
tag_suffix=gms:_gms
vcode=test
vname.gms=play6-{v}-gms
vname=play6-{v}
build_id={env:BUILD_ID|{vname}-{utcmin}}
var.root={t}
var.sys={t}/system
var.img={t}/system_play6_{tag}.img
var.OUTDIR=/out/target/product/generic
var.BASE={OUTDIR}/system
var.DEXP=/out/soong/dexpreopt_arm
var.IMAGE_INFO={OUTDIR}/obj/PACKAGING/systemimage_intermediates/system_image_info.txt
# The keystone SurfaceFlinger (steps.tsv 1d). SF_BASE_SHA: the base build's own
# /system/bin/surfaceflinger (built 2026-10-24, before lineage/patches/play6/0002 got stock sampling in lumen-os
# d0ba63d), the only base the binary is swapped into. SF_SHA: the binary lineage/play6_sf_build.sh built over that base
# with that 0002 (the 1.0.7-kst1 one: GL_LINEAR on every layer, edge AA, 4x MSAA, like stock GLESTrapezoidalRenderEngine).
# A new base build carries the patch itself: then drop step 1d and both pins, do not re-pin to the base's binary.
var.SF_BASE_SHA=f51b92de1d9996d8ee03fae651b71a3cd7283c6028770dccf4d60615e8720b49
var.SF_SHA=7c2cd71bcc7a23adda8b10818cc4f62045b4c90b7d9ec7ca49e56b4c7a921f3b
var.EXPS.exp={exp}
var.EXPS.expall=1,2,3,5
var.EXPS=-
