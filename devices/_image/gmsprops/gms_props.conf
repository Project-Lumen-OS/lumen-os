# Lumen OS Google sign-in helper (PlayIntegrityFix port): the identity the listed Google processes see.
# Format and rules: lineage/gmsprops/src/gmsprops_conf.h. Identity fields of PlayIntegrityFix's pif.prop; the
# helper derives the properties itself and never touches boot state, debuggable, SDK level or keys.
# Print: the Pixel 6a canary build Google's flash station listed on 2026-11-14 (PlayIntegrityFix autopif.sh
# logic), security patch from the Pixel bulletin. PROCESSES: PlayIntegrityFix's defaults (DroidGuard and the
# Play Store) plus the main GMS process, where the check-in that sets the device verdict runs, and the persistent
# one, where the account sign-in runs (live on HB beta14: only with these two did a check-in turn the verdict
# from blocked to allowed). A signed data update (/data/system/lumen/gms_props.conf, higher serial) replaces all
# of it.
serial=2
FINGERPRINT=google/bluejay_beta/bluejay:CANARY/ZP11.261016.008/16754936:user/release-keys
MANUFACTURER=Google
MODEL=Pixel 6a
SECURITY_PATCH=2026-11-05
DEVICE_INITIAL_SDK_INT=32
PROCESSES=com.google.android.gms.unstable,com.android.vending,com.google.android.gms,com.google.android.gms.persistent
