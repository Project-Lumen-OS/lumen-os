# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of the XGIMI RS30 Ultra Max (G0115) are
# published. Trial only, as every RS30: no update channel, no install for good; the release ships the trial image as
# system_dsu.img, SHA256SUMS signed with this model's OTA key.
tag=g0115-{version}
image=system_dsu.img
certs=devices/g0115/certs/ota.x509.pem devices/g0115/certs/ota_next.x509.pem
# The way back: the official XGIMI file of the unit's own stock version, the model's UpdateBinName (xgimiconfig G0115
# system.ini) in the folder of that build (sizes and md5 from the CDN, sha256 after a full download: the line's
# research/stock_v*.tsv and the site's restore sums).
restore_file=XGIMI_HORSEPOPULAR_XR08C.bin
restore_files=v1.1.47:2390561536:https://product-library.static.xgimi.com/firmware/release/MTK9681/athenathirdultra/MTK9681_DOHKO_1.1.47_20260524-180039/XGIMI_HORSEPOPULAR_XR08C.bin v1.2.27:2399802112:https://product-library.static.xgimi.com/firmware/release/MTK9681/athenathirdultra/MTK9681_DOHKO_1.2.27_20260629-223527/XGIMI_HORSEPOPULAR_XR08C.bin
