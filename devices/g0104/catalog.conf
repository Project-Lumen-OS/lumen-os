# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of the XGIMI AURA 3 Max are
# published. Trial only, as every RS30: no update channel, no install for good; the release ships the trial image as
# system_dsu.img, SHA256SUMS signed with this model's OTA key.
tag=g0104-{version}
image=system_dsu.img
certs=devices/g0104/certs/ota.x509.pem devices/g0104/certs/ota_next.x509.pem
# The way back: the official XGIMI file of the unit's own stock version, the model's UpdateBinName (xgimiconfig G0104
# system.ini) in the folder of that build (sizes and md5 from the CDN, sha256 after a full download: the line's
# research/stock_v*.tsv and the site's restore sums).
restore_file=XGIMI_HORSEPOPULAR_XR03F.bin
restore_files=v1.3.1:2404520704:https://product-library.static.xgimi.com/firmware/release/MTK9681/bollywoodproguonei/MTK9681_OSCAR_1.3.1_20260629-152744/XGIMI_HORSEPOPULAR_XR03F.bin
restore_stock=G0104:v1.3.1>v1.3.1
