# Lumen OS on the XGIMI Z9X HB (G0130, G0148): the settings of the one blobs reader /system/etc/z9x/z9x_blobs.sh
# (tools/ota/image/z9x_blobs.sh, every key explained there), image path /system/etc/z9x/blobs.conf. Data only.
# The HB's 4 MiB z9x_blobs (the Z9X layout) with the two files of blobs_allow.txt, no eye-protection group. A trial
# run reads them from the stock slot, whose VNDK APEX is the folder com.android.vndk.current (Android 13, flattened).
tag=z9x_blobs
allow=blobs_allow.txt
blocks=64
tmpfs=8m
maxf=4194304
eye=0
src_partition=0
stock_apex=flat
