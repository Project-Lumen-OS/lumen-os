# devices/goat_elegant/wallcolor.conf: the stock wall colour adaptation of G0130 (apps/core/lumen-wallcolor README.md), in the
# projector app as assets/lumen_wallcolor/model.conf. Stock: G0130 V6.16.24 and G0148 V6.17.12 xgimiconfig/G0130, G0148 feature/feature.xml, camera/camera.ini, xlab/AutoColor.ini.
model=G0130
# feature.xml support_wall_color_adjust_type (the pattern) and support_ambient_light (the card text)
type=3
ambient_light=false
# the vendor's camera, opened by the vendor itself through V4L2 (Lumen never opens it for this feature)
camera=CameraType 8, icSpring 32e6:9005 UVC 640x480, node usb1/1-2/1-2.1/1-2.1:1.0/video4linux (same on G0148); cameraserver is off in the vendor (config.disable_cameraservice)
# the stock vendor calls (codes in this model's hal/codes.tsv) and the event the flow follows
hal=DisplayManager 150 setAEOnOff, 108 startAutoColor, 115 setAutoColorCalibration, 114 setAutoColorDefault; events ProjectorFocusManager 1 setFocusCallback, type 11001
