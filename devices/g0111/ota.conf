# Lumen OS OTA data of the XGIMI X50 Ultra (G0111), host side: read by tools/devices/ota/ota_conf.py (format and keys in
# its header) and by tools/devices/devices.py check-wire. Data only, never sourced. Active since 2026-11-14 (maintainer
# order): the registry says ota_engine=update_engine and the public image carries the updater
# (apps/core/lumen-updater/README.md, "X50 family"); the X50 Ultra Max (devices/g0100/ota.conf) is the same data with
# its own wire id.
wire_id=x50
# the design notes (dump of 2026-11-08): group_oem_a / group_oem_b, maximum 4613734400 bytes each
super_group=group_oem=4613734400
# the stock vendor's ro.virtual_ab.compression.enabled=true (read on the installed G0111, 2026-11-13): lz4 snapshots
vabc=yes
# devices/g0111/certs/ota.x509.pem: RSA-4096
sig_size=512
scanner=devices/g0111/image/check_public_x50.py
# the X50 family's fixed tag: the installer's update-<id>-beta.json, and the updater's update-<id>-test.json (beta)
# and update-<id>-nogms.json (stable) beside it, never the same file
manifest_tag=x50
package_tag=x50-{version}
repo=Project-Lumen-OS/lumen-os
# the XGIMI set of apps/core/lumen-fwcopy (2026-11-15): what XGIMI's own update writes into the other slot,
# copied unchanged from the running slot by update_engine and by the in-trial install (vbmeta never, vendor,
# product, system_ext are dynamic and shared by both slots, not copied; ota_conf.py checks the list against the module)
ab_ota_partitions=boot bootdata dtbo mboot optee owl satf tvconfig tvservice vbmeta_system xgimiconfig
stage_channel=x50-test
