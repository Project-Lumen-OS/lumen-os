overlays=devices/g0111/certs/platform.x509.pem devices/g0111/certs/apex/FINGERPRINTS.txt devices/g0111/image/remove.txt devices/g0111/image/x50max_prop_pub.txt devices/g0111/image/x50max_model_prop.txt devices/g0111/image/x50_netadb.rc tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc devices/g0111/image/blobs.conf devices/g0111/image/x50_blobs_allow.txt devices/g0111/image/x50_nui.rc apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh apps/X50Projector/image/x50-projector.xml overlay/v1/z9x_setup.rc tools/devices/ota/image/lumen_ota.sh tools/devices/ota/image/lumen_ota.rc tools/devices/ota/image/lumen_update_verifier.rc devices/g0111/image/ota_gate.conf devices/g0111/image/otacerts.zip devices/g0111/image/remove_ota.txt tools/ota/image/z9x-updater-default-permissions.xml
tools=devices/g0111/image/compose_x50.sh devices/g0111/image/verify_tree_x50.py devices/g0111/image/x50_props.py devices/g0111/image/x50_apk_check.py devices/g0111/image/x50_kconfig.py devices/g0111/image/x50_power_keys.py devices/g0111/image/x50_perm_pkgs.py devices/g0111/image/x50_diag.py tools/lumen/apkinfo.py tools/erofs_kcheck.py
