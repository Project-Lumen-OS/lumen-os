# Lumen OS build descriptor: XGIMI X50 Ultra (g0111). Data only, read by tools/build/build.py (tools/build/README.md).
# Base: the published Z9X 1.0.9 image in ~/<remote_dir>/base (pinned in base.sha256; Lumen's own image, no XGIMI
# file). stage_dir: the X50's own APKs and platform set, built and signed with its keys on the Mac
# (tools/devices/build_apps.sh g0111 build/g0111/stage; never a key). The steps (devices/g0111/image/steps.tsv) are
# shared with the X50 Ultra Max (g0100). Variants are the two halves of a build:
#   stage  the staged tree ~/<remote_dir>/TAG/root, checked against the base (verify_stage.log)
#   image  the erofs image of that tree, fsck, the kernel rule check, the mounted image checked again
codename=g0111
model=G0111
keys=g0111
ota_channel=none
base=erofs {out}/base/z9x-1.0.9-anp-system.img
base_pin=devices/g0111/image/base.sha256
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector Z9xHome X50TvInput
