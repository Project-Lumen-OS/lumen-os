overlays=devices/g0111/image/remove.txt devices/g0111/image/x50max_prop_pub.txt devices/g0111/image/x50max_model_prop.txt devices/g0111/image/x50_netadb.rc devices/g0111/image/x50_blobs.sh devices/g0111/image/x50_blobs.rc devices/g0111/image/x50_blobs_allow.txt devices/g0111/image/x50_nui.rc tools/devices/image/blobs_stock_dsu.sh apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh apps/X50Projector/image/x50-projector.xml
