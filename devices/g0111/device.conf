# Lumen OS device registry: XGIMI X50 Ultra (README.md). Data only, never sourced:
# tools/devices/devices.py reads it (format and keys in its header).
# Its firmware is built from the same XGIMI product image as the Z9X, so it reports ro.product.device
# horse_popular; devices/horse_popular is the Z9X. This entry gives the pair (horse_popular, G0111) its own
# name g0111, so no tool takes it for the Z9X. Facts: the stock dump on xgimi-builder (~/devices/g0111_mt9681,
# info/getprop.txt: ro.boot.hardware mt9681, ro.board.platform mt5877, ro.vndk.version 34, vendor v1.2.64).
# 2026-11-07: supported for TEST images only (devices/g0111/image, x50-tN). Own keys (keys_dir, certs/) and the
# installer profile x50 (installer/lib/devices.conf, FAMILY=z9x) exist; no OTA, no release channel yet
# (README.md "Keys", "Installer profile").
codename=g0111
family=horse_popular
status=supported
name=XGIMI X50 Ultra
models=G0111
platform=mt5877
hardware=mt9681
abi=arm64
# the published Z9X 1.0.9 image (arm64 LineageOS 21 TV GSI with the Lumen apps), pinned in image/base.sha256
base_product=lumen-image z9x-1.0.9
vendor_sdk=34
vendor_firmware=v1.2.64
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
# the Z9X-like fastbootd flow (installer profile x50); fastbootd over USB is unverified on the X50 (its recovery
# loads mtu3 with mtu3_dev_en=0): nothing is installed before the maintainer's OK
install_flow=ab-fastbootd
ota_engine=none
ota_wire_id=none
prop_namespace=ro.lumen
# the X50's own platform and OTA keys (tools/devices/gen_device_keys.sh g0111, maintainer's decision; public certificates
# in devices/g0111/certs); the APKs of the Z9X 1.0.9 base stay its unchanged bytes, the X50's own apps (apps
# below) are signed with this platform key on the Mac (tools/devices/build_apps.sh g0111)
keys_dir=~/.lumen-keys/g0111
app_prefix=X50
channel=none
installer_id=x50
# fastbootd of this family answers product mt5877 like the Z9X: never enough to tell them apart (README.md)
fastboot_product=mt5877
forks=devices/g0111/forks.tsv
# one app of ours in the X50 image calls the projector HAL (Z9xProjector is removed, devices/g0111/image): the
# eye-follow fail-safe apps/X50EyeGuard (maintainer's decision 2026-11-07), which also
# sends the stock boot handshake, with exactly the eight calls of
# research/allowed_x50eyeguard.tsv (the version and hash guard; DisplayManager 127 and 62, read only: the guard sends no
# eye-protection setter, the switch and mode are the projector menu's rows (61, 126); SystemManager 32 with 1 / 2, 33, 36 with 1; PowerManager 2 with 0 / 1), checked
# by tools/devices/check_aidl_hal.py
# on its sources and its dex and in the image by image/verify_tree_x50.py
hal_check=aidl-table
hal_app=apps/X50EyeGuard
hal_codes=devices/g0111/research/aidl_codes.tsv
# the X50 has the HB's AIDL codes at the same places (research/new_vs_hb.tsv: 40 more), so the HB's table of
# banned and review calls holds here too; none of the eight allowed calls is in it
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/g0111/research/allowed_x50eyeguard.tsv
# the second HAL app of the image, the projector menu, with its own allow list (tools/devices/check_hal.py checks both)
hal_more=apps/X50Projector:devices/g0111/research/allowed_x50projector.tsv
# t20 (decision 2026-11-10): the menu's three exceptions to hal_banned (correctKeystone 11, setTiltShiftMove 88,
# autoFocus 3), each with its argument range; passed by check_hal.py to the menu's check only
hal_unbanned=apps/X50Projector:devices/g0111/research/unbanned_x50projector.tsv
# device-only apps (image/compose_x50.sh): X50EyeGuard in /system/app, the power-key framework RRO X50PowerOverlay in
# /system/product/overlay, and (t8) the install-from-DSU app LumenDsuInstall in /system/priv-app (acts only while
# ro.gsid.image_running=1; a real install on the X50 needs the maintainer switch),
# and (t11) the projector menu X50Projector in /system/priv-app (the gear key; its own allow list
# research/allowed_x50projector.tsv, checked by apps/X50Projector/test/run.sh with tools/devices/check_aidl_hal.py and in
# the image by image/verify_tree_x50.py MENU_APP), which also hosts the remote pairing of t10 (the former X50Remote app:
# the original XGIMI RC bonds by itself), and (t17) X50TvInput: the HDMI input app org.lumen.tvinput built from
# devices/g0111/app/X50TvInput.layers (apps/Z9xTvInput + the X50 source picker look) in place of the base's Z9xTvInput
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput
