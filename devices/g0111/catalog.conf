# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
tag=x50-{version}
image=lumen-os-x50-{version}-nogms-system.img
beta_manifest=https://github.com/Project-Lumen-OS/lumen-os/releases/download/x50/update-x50-beta.json
# The way back (Settings > About > Back to the XGIMI system, apps/core/lumen-about): the file name the XGIMI recovery
# USB stick needs, the official XGIMI files (version:size in bytes:address, sizes read from XGIMI's server) and per
# model the stock versions with the official version each goes back with (the release notes of x50-1.0.10-beta3: your
# version or a higher one, never a lower one).
restore_file=XGIMI_HORSEPOPULAR_XR04E.bin
restore_files=v1.2.54:2693731168:https://product-library.static.xgimi.com/firmware/release/MTK9681/diana/MTK9681_DOHKO_1.2.54_20260615-231328/XGIMI_HORSEPOPULAR_XR04E.bin v1.2.64:2693993312:https://product-library.static.xgimi.com/firmware/release/MTK9681/diana/MTK9681_DOHKO_1.2.64_20260629-115816/XGIMI_HORSEPOPULAR_XR04E.bin
restore_stock=G0111:v1.2.64>v1.2.64,v1.2.54>v1.2.54
# Lumen OS 1.0.10-beta5 and beta6 refuse every update (their LumenUpdater 1, fixed in LumenUpdater 2 of beta7):
# Lumen Installer 1.0.6 updates that app with the copy a release carries (the image's own APK, platform key), then
# the newer beta comes over the internet. No release carries the file = no row.
app_update=lumen-updater-x50-{version}.apk 1.0.10-beta5 1.0.10-beta6
