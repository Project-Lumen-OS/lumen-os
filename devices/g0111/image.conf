# Lumen OS image recipe: XGIMI X50 Ultra (g0111). Data only, read by tools/devices/devices.py (keys in its header)
# and tools/image/compose.sh. The composer runs on the build host from the published Z9X 1.0.9 image in
# ~/x50-out/base (pinned in base.sha256; Lumen's own image, no XGIMI file); only these files are staged, and
# stage_dir: the X50's own APKs, built and signed with its platform key on the Mac (tools/devices/build_apps.sh
# g0111 build/g0111/stage; never a key). Test images only (x50-tN-net, devices/g0111/README.md). Variants are the
# composer's two halves:
#   stage  steps 0-7: the staged tree ~/x50-out/x50-tN-net/root, checked against the base (verify_stage.log)
#   image  steps 8-11: the erofs image of that tree, fsck, the kernel rule check, the mounted image checked again
generic=yes
entry=tools/image/compose.sh
compose=devices/g0111/image/compose_x50.sh
host=xgimi-builder
remote_dir=x50-out
stage=devices/g0111/image/compose_x50.sh devices/g0111/image/verify_tree_x50.py devices/g0111/image/x50_props.py devices/g0111/image/base.sha256 devices/g0111/image/remove.txt devices/g0111/image/x50_prop.txt devices/g0111/image/x50_model_prop.txt devices/g0111/image/x50_netadb.rc devices/g0111/image/x50_blobs.sh devices/g0111/image/x50_blobs.rc devices/g0111/image/x50_blobs_allow.txt devices/g0111/image/x50_nui.rc devices/g0111/image/x50_apk_check.py devices/g0111/image/x50_kconfig.py devices/g0111/image/x50_power_keys.py tools/erofs_kcheck.py
variants=stage:--stage-only image:--image-only
fs=erofs
stage_dir=build/g0111/stage
