# Lumen OS on the XGIMI X50 family (X50 Ultra G0111, Ultra Max G0100, TITAN Noir H0061, Pro H0062 and Max H0063,
# RS30 Ultra Max G0155 with its own allow-list under the same image name): the settings of the one blobs reader /system/etc/z9x/z9x_blobs.sh
# (tools/ota/image/z9x_blobs.sh, every key explained there), image path /system/etc/z9x/blobs.conf. Data only.
# The 16 MiB z9x_blobs with the codec / audio files and the stock eye-protection drawer of x50_blobs_allow.txt
# (need=eye, sys.lumen.nui for x50_nui.rc). A trial run reads them from the stock slot, whose VNDK APEX is a
# com.android.vndk.current.apex file (Android 14).
tag=x50_blobs
allow=x50_blobs_allow.txt
blocks=256
tmpfs=32m
maxf=8388608
eye=1
src_partition=1
stock_apex=zip
