# Lumen OS OTA boot gate data of the X50 family with updates (XGIMI X50 Ultra G0111, Ultra Max G0100; image path
# /system/etc/lumen/ota_gate.conf, 0644), read strictly by tools/devices/ota/image/lumen_ota.sh (every mode except count
# and verifier; a missing or invalid file = no rollback). docs/architecture/OTA_CLIENT.md section 3.
#   hal              the AIDL boot HAL android.hardware.boot.IBootControl/default through 'service call' (the Z9X
#                    route; the X50's vendor android.hardware.boot-service.default answers the measured reply shapes,
#                    read on the installed G0111 2026-11-14); no bootctl in the image
#   health           init services that must run before the gate marks the slot; xgimi_middle is the vendor gmpf
#                    service (xgimi.hardware.gmpf-service: lamp, fans), as on the HB
#   ns               property namespace (ro.lumen.ota.gate, ro.lumen.build_id, ro.lumen.ota.test_fail)
#   max_attempts     boot attempts of an update slot before the rollback
#   deadline         s after post-fs-data: no boot_completed -> rollback
#   health_delay     s after boot_completed before the health checks
#   start_count_max  system_server starts before boot_completed -> rollback
hal=aidl
health=zygote surfaceflinger xgimi_middle
lamp=xgimi_middle
ns=ro.lumen
max_attempts=3
deadline=480
health_delay=90
start_count_max=4
