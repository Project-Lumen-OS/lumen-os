# Screen casting on every RS 20 model (G0063 G0067 G0077 G0078 G0079 G0086 G0087 G0088 G0089): data of the one shared
# feature (AirPlay receiver org.lumen.airplay with the casting screen, Miracast sink org.lumen.miracast, DLNA through
# Lumen Play), read by tools/devices/cast_models.py. The model codes and the ABI come from device.conf. Every model has
# every receiver (2026-11-21: casting is one shared feature set on EVERY model), so only real hardware differences
# live here; the RS 20 recipe (devices/_family/rs20/rs20.build.conf) already ships all three receivers.
# Stock evidence: the vendor of the official FULL packages v1.6.50 (XR04A), v1.6.52 (XR03A) and v1.6.55 (XR03C), read
# by HTTP ranges on xgimi-llm (~/suites-red-1128/vendor_165x.img): android.hardware.wifi.direct in
# vendor/etc/permissions/mtv_core_hardware.xml, wpa_supplicant started with -N -ip2p0 -c p2p_supplicant.conf
# (vendor/etc/init/hw/init.common.rc), c2.mtk.avc/hevc.decoder up to 4096x2304 with low-latency (vendor/etc/media_codecs.xml).
airplay=1
miracast=1
# offer the 4K (HEVC) mirroring quality: every RS 20 code shows 4K (vendor/etc/xgimimodelname/<G>/build.prop
# xgimi.image4k.support=1, ro.product.unique ...+ProjectorUHD_3) and its decoder takes it
mirror_4k=1
