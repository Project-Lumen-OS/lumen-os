# Lumen OS build descriptor, family file: the nine RS 20 models (devices/_family/rs20/rs20.device.conf) on the RS 20
# recipe, devices/_family/rs20/image/steps.tsv. Data only, read by tools/build/build.py through tools/devices/layered.py.
# The image is composed as every model on the Z9X 1.0.9 image (devices/_family/x50/x50.build.conf: the pinned base, its
# platform set re-signed on the model's own keys by devices/g0111/image/sign_x50_base.py, the stage and image passes)
# with the apps of the Z9X family: the RS 20 runs the Z9X chip, kernel, vendor line and HIDL HAL, its IGmpf2 codes are
# the model's own table (devices/_family/rs20-hal330, rs20-hal312). Trial images only: no updater, no install from the
# trial, no channel. A model file holds only its own keys; {codename} is the including model's.
include=devices/_family/x50/x50.build.conf
apps=Z9xProjector Z9xHome Z9xSetup Z9xTvInput Z9xAirPlay Z9xFrameworkKeysOverlay LumenMiracast LumenWifiP2pOverlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
props=devices/_family/rs20/image/rs20_prop.txt devices/{codename}/image/{codename}_model_prop.txt
overlays=devices/{codename}/certs/platform.x509.pem devices/{codename}/certs/apex/FINGERPRINTS.txt devices/_family/rs20/image/remove.txt tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc tools/ota/image/blobs.conf overlay/v1/z9x_setup.rc overlay/v1/z9x_base.rc overlay/v1/z9x_nui.sh overlay/v1/z9x-sysconfig-nogms.xml tools/ota/image/z9x_gapps.sh apps/core/lumen-audio/image/lumen_boot_sound.rc apps/core/lumen-signal/image/lumen_hdmirx.rc apps/core/lumen-signal/image/lumen_hdmirx.sh overlay/v1/bootanimation.zip overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/keylayout/Vendor_000d_Product_3838.kl overlay/v1/keylayout/Vendor_000d_Product_3840.kl overlay/v1/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_000d_Product_3842.kl overlay/v1/keylayout/Vendor_000d_Product_3843.kl overlay/v1/keylayout/Vendor_1d5a_Product_c081.kl overlay/v1/keylayout/Vendor_26e3_Product_af02.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl
tools=devices/_family/rs20/image/verify_rs20.py devices/g0111/image/x50_props.py devices/_image/checks/about_version.py tools/erofs_kcheck.py tools/brand/bootanim_check.py devices/_image/checks/airplay_libs.py
steps=devices/_family/rs20/image/steps.tsv
host=xgimi-llm
remote_dir={codename}-out
version=pub:[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(-(beta|rc)[0-9]{1,2})?
samples=1.0.10-beta1
epoch={bidepoch}
tag={TAGP}-{v}
build_id=lumen-{TAGP}-{v}-{bid}
uuid=lumen-{TAGP}:{tag}:{bid}:{base_sha256}
var.PROPF=rs20_prop.txt
var.MPROPF={codename}_model_prop.txt
# the official packages unpacked on the build host (xgimi-llm ~/rs20-1124/<FW>/fs, devices/_family/rs20-16xx/stock.tsv)
var.RS20_STOCK={env:RS20_STOCK|{home}/rs20-1124}
var.STOCK_MODEL={RS20_STOCK}/{FW}/fs/vendor/etc/xgimimodelname/{MODEL}/build.prop
