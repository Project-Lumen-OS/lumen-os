include=devices/_family/z9x/z9x.device.conf
# The RS 20 line (devices/README.md, gsi-research LINEUP 2026-11-24): nine model codes of one MT9681 firmware line
# (project athenaultra, job DOHKO, branch MTK9681_YDN_SWK_TEMP_20260212), the Z9X chip, kernel, fstab and HIDL HAL with
# IGmpf2 numbered its own way (hal/codes.from). Trial only: no updates, no install, no channel.
# Trial images: devices/_family/rs20/rs20.build.conf (each model's build.conf includes it), each model on its own keys
# (tools/devices/gen_device_keys.sh, devices/g0111/image/gen_x50_apex_keys.sh), never the Z9X release set.
keys_dir=~/.lumen-keys/{codename}
# the apps tools/devices/build_apps.sh builds on the model's key (the image recipe places the same list)
apps=Z9xProjector Z9xHome Z9xSetup Z9xTvInput Z9xAirPlay Z9xFrameworkKeysOverlay LumenMiracast LumenWifiP2pOverlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
ota_engine=none
ota_wire_id=none
channel=none
