# Lumen OS build descriptor, family file: the keys every MT9681 model shares (X50 Ultra G0111, Ultra Max G0100, TITAN
# Noir H0061, Noir Pro H0062, Noir Max H0063, RS30 Ultra Max G0155, RS30 Ultra G0170). Data only, read by
# tools/build/build.py through tools/devices/layered.py (devices/README.md). A model file names its family file on its
# first key line (include=) and holds only its own keys; {codename} is the including model's.
keys={codename}
ota_channel=none
# apps that enter the image as their published APK with their own key (devices/_image/prebuilt.tsv)
prebuilt=LumenPlay
fs=erofs
pack=erofs -b4096 -zlz4hc -E noinline_data
var.bid={env:BUILD_ID|{utcmin}}
var.LABEL=u:object_r:system_file:s0
