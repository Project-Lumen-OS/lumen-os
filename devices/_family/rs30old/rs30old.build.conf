# Lumen OS build descriptor, line file: RS30 old line (RS30 Pro G0125, Pro Max G0124, Ultra G0114, Ultra Max G0115) on the RS30 recipe (devices/g0155/image/steps.tsv). Data only
# (devices/README.md); {codename} is the including model's.
include=devices/_family/rs30/rs30.build.conf
remote_dir={codename}-out
# super group group_oem 4613734400 (the payload's dynamic partition metadata, every firmware of the line) minus the
# largest kept vendor 1450934272, product 65830912 and system_ext 24252416 of v1.2.27/v1.1.47
budget=3072716800
blobs=devices/_family/rs30old/image/rs30old_blobs_allow.txt
var.ALLOWF=rs30old_blobs_allow.txt
var.TAGP={codename}
# the official v1.2.27 FULL OTA unpacked on the build host (no dump of a unit): its boot.img is the stock kernel
var.DUMP={env:RS30OLD_FW|{home}/devices/rs30old_fw/v1227}
var.KBOOT={DUMP}/img/boot.img
