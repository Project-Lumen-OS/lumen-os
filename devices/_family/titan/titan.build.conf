# Lumen OS build descriptor, family file: the three TITANs (H0061 Noir, H0062 Noir Pro, H0063 Noir Max), trial images
# on the X50 recipe. Data only, read by tools/build/build.py through tools/devices/layered.py (devices/README.md). A
# model file names its family file on its first key line (include=) and holds only its own keys; {codename} is the
# including model's.
include=devices/_family/x50/x50.build.conf
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector Z9xHome Z9xSetup X50TvInput Z9xAirPlay LumenMiracast LumenWifiP2pOverlay LumenKeyboard LumenPackageInstallerOverlay LumenFiles
props=devices/{codename}/image/{codename}_prop_pub.txt devices/{codename}/image/{codename}_model_prop.txt
overlays=devices/{codename}/certs/platform.x509.pem devices/{codename}/certs/apex/FINGERPRINTS.txt devices/g0111/image/remove.txt devices/g0111/image/x50_netadb.rc tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc devices/g0111/image/blobs.conf devices/g0111/image/x50_blobs_allow.txt devices/g0111/image/x50_nui.rc apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh apps/LumenProjector/host/activity/image/x50-projector.xml overlay/v1/z9x_setup.rc apps/core/lumen-audio/image/lumen_boot_sound.rc apps/core/lumen-signal/image/lumen_hdmirx.rc apps/core/lumen-signal/image/lumen_hdmirx.sh overlay/v1/bootanimation.zip overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/lumen-cast-sysconfig.xml devices/_image/checks/airplay_libs.py
host=xgimi-llm
version=pub:[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(-(beta|rc)[0-9]{1,2})?
samples=1.0.10-beta1
epoch={bidepoch}
var.public=1
var.PROPF={codename}_prop_pub.txt
var.MPROPF={codename}_model_prop.txt
# ota (steps.tsv, the update client of the shared X50 steps) stays off: no updater in a TITAN image yet (2026-11-14,
# the installer's TITAN profiles keep the stock vbmeta closed)
flags_off=test ota
