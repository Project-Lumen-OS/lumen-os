# Lumen OS device registry, family file: the three TITANs (H0061 Noir, H0062 Noir Pro, H0063 Noir Max), trial images
# on the X50 recipe. Data only, read by tools/devices/devices.py through tools/devices/layered.py (devices/README.md). A
# model file names its family file on its first key line (include=) and holds only its own keys; {codename} is the
# including model's.
include=devices/_family/x50/x50.device.conf
# v1.2.99 (2026-09-07, the newest overseas build) and v1.2.54: gmpf hash ad74d059 (the X50 v1.2.64 table plus 20
# appended methods) on v1.2.99 and the X50 v1.2.54 hash ecadd76e on v1.2.54, each accepted only on that firmware
# (org.lumen.hal.GmpfHash.TITAN_RULE, the TITAN Noir Pro's: one build)
# v1.3.38 (2026-11-25, the overseas build of 2026-11-16, one file for all three TITANs, gsi-research/H0063_FW_1.3.38.md):
# the gmpf library, com.xgimi.middle.jar and code table of the X50 v1.3.38 (hash dda0c216), the same kernel, dtb, boot
# first stage, fstab, gsid, vendor init, VINTF, vendor SELinux and blobs sources as the X50 v1.3.38; accepted only there
vendor_firmware=v1.2.99 v1.2.54 v1.3.38
ota_engine=none
ota_wire_id=none
hal_codes_also=devices/g0111/research/aidl_codes_v1254.tsv devices/h0062/research/aidl_codes_v1299.tsv devices/g0111/research/aidl_codes_v1338.tsv
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput Z9xSetup Z9xAirPlay LumenMiracast LumenWifiP2pOverlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
