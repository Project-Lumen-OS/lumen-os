# Lumen OS build descriptor, family file: the five models on the X50 recipe (devices/g0111/image/steps.tsv: X50 Ultra,
# Ultra Max and the three TITANs). Data only, read by tools/build/build.py through tools/devices/layered.py
# (devices/README.md). A model file names its family file on its first key line (include=) and holds only its own
# keys; {codename} is the including model's.
include=devices/_family/mt9681/mt9681.build.conf
base=erofs {out}/base/z9x-1.0.9-anp-system.img
base_pin=devices/g0111/image/base.sha256
tools=devices/g0111/image/compose_x50.sh devices/g0111/image/verify_tree_x50.py devices/g0111/image/x50_props.py devices/_image/checks/about_version.py devices/g0111/image/x50_apk_check.py devices/g0111/image/x50_kconfig.py devices/g0111/image/x50_power_keys.py devices/g0111/image/x50_perm_pkgs.py devices/g0111/image/x50_diag.py tools/lumen/apkinfo.py tools/erofs_kcheck.py tools/brand/bootanim_check.py
steps=devices/g0111/image/steps.tsv
stage_dir=build/{codename}/stage
variants=stage:--stage-only image:--image-only
pack_tool={home}/lumen-builder-backup/lineage-out/host/linux-x86/bin
options=--stage-only:stage --image-only:image
refuse=stage,image:--stage-only and --image-only do not go together
build_id=lumen-{PREFIX}-{v}-{bid}
uuid=lumen-x50:{tag}:{bid}:{base_sha256}
budget=2500000000
var.DUMP={env:X50_DUMP|{home}/devices/g0111_mt9681/work/fs}
var.STOCK_MODEL={DUMP}/vendor/etc/xgimimodelname/{MODEL}/build.prop
var.BOOT={env:X50_BOOT|{home}/devices/g0111_mt9681/dump}
var.BOOT_SHA=bf169bef493291a8cada10fa688ff53a62b22043e7e82fcfba9c4db76fc7d2f5
var.BASE_BUILD_ID=lumen-1.0.9-20261106anp
# the Wi-Fi APEX with lineage/patches/wifi/0001 (Mac build artifact)
built=build/wifi_apex/arm64/com.android.wifi.capex build/wifi_apex/arm64/service-wifi.odex build/wifi_apex/arm64/service-wifi.vdex
var.WIFI_APEX_SHA=97f942dc2cc1911ac5e6cd0c314c2c0d52e044e9356b5f84477023a51f614274
# its service-wifi.jar dexpreopted as the base build does (tools/base_patch/wifi_dexpreopt.sh, proven on the base jar):
# a missing odex makes the first start compile it before early-boot (z9x-installfail-1128)
var.WIFI_ODEX_SHA=751c241d08d0ed69040bc1c52ed90f0114ff816692794c5481ca3dcfde551eb9
var.WIFI_VDEX_SHA=683a088c08f33bebd5b4dbc4d7b794bea30dde71997d23110018ad73cbfe522c
# the separator of dexpreopt file names (apex<AT>module<AT>javalib<AT>jar<AT>classes): check_publish.py reads a
# literal one as an e-mail address
var.AT=@
# the base's services.jar fix (tools/base_patch/framework.tsv)
framework=z9x
