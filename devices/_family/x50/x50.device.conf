# Lumen OS device registry, family file: the five models on the X50 recipe (devices/g0111/image/steps.tsv: X50 Ultra,
# Ultra Max and the three TITANs). Data only, read by tools/devices/devices.py through tools/devices/layered.py
# (devices/README.md). A model file names its family file on its first key line (include=) and holds only its own
# keys; {codename} is the including model's.
include=devices/_family/mt9681/mt9681.device.conf
abi=arm64
# the published Z9X 1.0.9 image (arm64 LineageOS 21 TV GSI with the Lumen apps), pinned in image/base.sha256
base_product=lumen-image z9x-1.0.9
hal_codes=devices/g0111/research/aidl_codes.tsv
