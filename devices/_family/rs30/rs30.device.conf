# Lumen OS device registry, family file: the two RS30 models on the RS30 recipe (devices/g0155/image/steps.tsv: RS30
# Ultra Max G0155, RS30 Ultra G0170). Data only, read by tools/devices/devices.py through tools/devices/layered.py
# (devices/README.md). A model file names its family file on its first key line (include=) and holds only its own
# keys; {codename} is the including model's.
include=devices/_family/mt9681/mt9681.device.conf
# one exception list for every model of the family (the same X50Projector calls on every RS30 stock)
hal_unbanned=apps/LumenProjector/host/activity:devices/_family/rs30/research/unbanned_x50projector.tsv
# 32-bit userspace (zygote32, armeabi-v7a only): its image can never be the arm64 Z9X 1.0.9 image the X50 uses
abi=arm32
# its own arm32 base: LineageOS 21 lineage_gsi_tv_arm from lineage/manifests/lumen-lineage-21.xml with the HB / Play 6
# patches (lineage/patches/play6) and the Codec2 store patch, built WITH uffd GC
base_product=lineage_gsi_tv_arm uffd
ota_engine=none
ota_wire_id=none
channel=none
apps=X50EyeGuard X50PowerOverlay X50Projector X50TvInput Z9xSetup Z9xHome LumenMiracast LumenWifiP2pOverlay Z9xAirPlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
