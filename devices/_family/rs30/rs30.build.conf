# Lumen OS build descriptor, family file: the two RS30 models on the RS30 recipe (devices/g0155/image/steps.tsv: RS30
# Ultra Max G0155, RS30 Ultra G0170 and the models of the rs30old and mira line files). Data only, read by tools/build/build.py through tools/devices/layered.py
# (devices/README.md). A model file names its family file on its first key line (include=) and holds only its own
# keys; {codename} is the including model's.
include=devices/_family/mt9681/mt9681.build.conf
# one prop file for every model (its name, tag prefix, codename and model filled from var.NAME, var.TAGP, codename and
# var.MODEL by the recipe) and the model's stock model props; the stock blob allow list of the model's firmware line is
# blobs= with var.ALLOWF in the model or line file
props=devices/_family/rs30/image/rs30_prop.txt devices/{codename}/image/{codename}_model_prop.txt
overlays=devices/g0155/image/debloat.txt devices/_image/debloat_launcher.txt devices/g0155/image/rs30-sysconfig.xml overlay/v1/z9x-sysconfig-nogms.xml overlay/v1/privapp-permissions-z9xsetup.xml overlay/v1/privapp-permissions-z9xhome.xml overlay/v1/z9x-home-default-permissions.xml overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/z9x-airplay-default-permissions.xml overlay/v1/bootanimation.zip overlay/v1/keylayout/Generic.kl overlay/v1/keylayout/Vendor_0001_Product_0001.kl overlay/v1/keylayout/Vendor_000d_Product_3838.kl overlay/v1/keylayout/Vendor_000d_Product_3839.kl overlay/v1/keylayout/Vendor_000d_Product_3840.kl overlay/v1/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_000d_Product_3842.kl overlay/v1/keylayout/Vendor_000d_Product_3843.kl overlay/v1/keylayout/Vendor_1d5a_Product_c081.kl overlay/v1/keylayout/Vendor_26e3_Product_af02.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl overlay/v1/keylayout/Vendor_9999_Product_0666.kl overlay/v1/keylayout/Vendor_9999_Product_0777.kl overlay/v1/idc/Vendor_000d_Product_3838.idc overlay/v1/idc/Vendor_000d_Product_3839.idc overlay/v1/idc/Vendor_000d_Product_3840.idc overlay/v1/idc/Vendor_000d_Product_3841.idc overlay/v1/idc/Vendor_000d_Product_3842.idc overlay/v1/idc/Vendor_000d_Product_3843.idc overlay/v1/idc/Vendor_1d5a_Product_c081.idc overlay/v1/idc/Vendor_26e3_Product_af02.idc devices/g0111/image/x50_netadb.rc tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc devices/g0111/image/blobs.conf devices/g0111/image/x50_nui.rc tools/ota/image/xgimi_compat_public.rc apps/LumenProjector/host/activity/image/x50-projector.xml apps/core/lumen-audio/image/lumen_boot_sound.rc apps/core/lumen-signal/image/lumen_hdmirx.rc apps/core/lumen-signal/image/lumen_hdmirx.sh
tag={TAGP}-{v}
build_id=lumen-{TAGP}-{v}-{bid}
uuid=lumen-{TAGP}:{tag}:{bid}:{base_sha256}
var.PROPF=rs30_prop.txt
var.MPROPF={codename}_model_prop.txt
base=ext4 {BASE}/out/target/product/generic/system.img
base_pin=devices/g0155/image/base.sha256
apps=X50EyeGuard X50PowerOverlay X50Projector X50TvInput Z9xSetup Z9xHome LumenMiracast LumenWifiP2pOverlay Z9xAirPlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
tools=devices/g0155/image/compose_rs30.sh devices/g0111/image/x50_props.py devices/_image/checks/about_version.py devices/g0111/image/x50_kconfig.py devices/g0111/image/x50_power_keys.py devices/g0155/image/rs30_menu_keys.py tools/erofs_kcheck.py tools/lumen/lumen_checks.py tools/lumen/apkinfo.py devices/_image/checks/airplay_libs.py tools/brand/bootanim_check.py
steps=devices/g0155/image/steps.tsv
host=xgimi-llm
stage_dir=build/{codename}/signed_stage
variants=net: unsigned:--unsigned
pack_tool={BASE}/out/host/linux-x86/bin
version=test:t[0-9]|t[0-9][0-9]
options=--unsigned:unsigned
samples=t2
# every file of the image dated at the build id (ro.build.date is the same minute), as the t1 / t2 composer did: a
# fixed old date would give two different trial images the same file times (PackageManager's parse cache goes by them)
epoch={bidepoch}
tag_suffix=!unsigned:-net unsigned:-unsigned
var.BASE={env:RS30_BASE|{home}/rs30-base}
var.LIB=u:object_r:system_lib_file:s0
# the stock kernel the base needs (userfaultfd GC, 32-bit compat): the boot partition of the model's dump (var.DUMP)
var.KBOOT={DUMP}/boot_b.img.gz
# the base's services.jar fix (tools/base_patch/framework.tsv)
framework=rs30
