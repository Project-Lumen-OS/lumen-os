# What tools/devices/sign_device.py signs for every model of the RS30 family. Data only, format and keys as
# devices/goat_elegant/image/sign.conf; {codename} and {remote_dir} are the model's (sign_device.py fills them). The base
# is the RS30 base (its own arm32 LineageOS 21 TV build on builder-llm, the design notes, one pin), on the
# AOSP test keys like the HB base: the platform set moves to the model's platform key, the APEXes keep the base build's
# own module test keys. Each model has its own APEX work dir on the build host, so two models never share it. No pinned
# APK: the AirPlay receiver is built by build_apps.sh like the other apps of the registry.
base_image_remote=rs30-base/out/target/product/generic/system.img
base_sha256=devices/g0155/image/base.sha256
base_dir=build/{codename}/base_platform
pinned=none
host_bin_remote=rs30-base/out/host/linux-x86/bin
module_keys_remote=rs30-base/src/packages/modules
apex_work_remote={remote_dir}/apex_sign
stage=build/{codename}/signed_stage
test_keys_remote=rs30-base/src/build/make/target/product/security
