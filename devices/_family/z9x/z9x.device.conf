# The Z9X family (devices/README.md): the MT5877 projectors on the XGIMI HIDL HAL xgimi.hardware.gmpf@1.0 with an arm64
# vendor 34, the Z9X G0082 (horse_popular) and the RS 20 line (devices/_family/rs20); T10, S70 and S80 run the same
# kernel and vendor line. The chip, HAL and image base keys every member shares. A member's HIDL codes are its own
# table, derived by method name (tools/hal/derive.py), never this family's numbers.
include=devices/_vendor/xgimi/xgimi.device.conf
platform=mt5877
hardware=mt9952
abi=arm64
base_product=prebuilt-tar system_tv_v4.tar
vendor_sdk=34
hal_transport=hidl
hal_family=hidl-gmpf
image_fs=erofs
slots=ab-virtual
install_flow=z9x-usb
prop_namespace=ro.z9x
keys_dir=~/.lumen-keys
fastboot_product=mt5877
forks=none
hal_check=z9x-callers
hal_app=apps/LumenProjector/core
hal_codes=none
hal_banned=none
