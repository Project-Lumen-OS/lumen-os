# Lumen OS device registry, family file: the X50 Ultra (G0111) and Ultra Max (G0100), the published line with installs
# and OTA. Data only, read by tools/devices/devices.py through tools/devices/layered.py (devices/README.md). A model
# file names its family file on its first key line (include=) and holds only its own keys; {codename} is the including
# model's.
include=devices/_family/x50/x50.device.conf
# v1.2.54 (2026-11-11): the same kernel, boot ramdisk, gsid and vendor init as
# v1.2.64; its gmpf hash ecadd76e (the v1.2.64 table without DisplayManager 217..223) and its own eye-protection
# pair are accepted only on that firmware (HashRule, alt= lines of the blobs allow-list)
# v1.3.38 (2026-11-20, gsi-research/X50_FW_1.3.38.md): the same kernel build and config, boot ramdisk first stage,
# fstab, gsid, vendor init and VINTF as v1.2.64; its gmpf hash dda0c216 (the v1.2.64 table plus 53 appended
# methods) and its own eye-protection pair are accepted only on that firmware
vendor_firmware=v1.2.64 v1.2.54 v1.3.38
# 2026-11-14 (maintainer order, rules.md 2.34): X50 updates open. The public image carries the shared updater
# (devices/g0111/app/LumenUpdater.layers, /system/app/LumenUpdater), the g0111 OTA certificates in otacerts.zip and the
# neutral boot gate (tools/devices/ota/image); update_engine writes the other slot, which on an installed X50 is the
# stock slot a (LumenDsuInstall Profile.X50 updatesToStockSlot). Data of the OTA tools: devices/g0111/ota.conf
ota_engine=update_engine
ota_tools=tools/devices/ota
hal_codes_also=devices/g0111/research/aidl_codes_v1254.tsv devices/g0111/research/aidl_codes_v1338.tsv
# device-only apps (image/compose_x50.sh): X50EyeGuard in /system/app, the power-key framework RRO X50PowerOverlay in
# /system/product/overlay, and (t8) the install-from-DSU app LumenDsuInstall in /system/priv-app (acts only while
# ro.gsid.image_running=1; a real install on stock 1.2.64 since 2026-11-13, apps/LumenDsuInstall the design notes),
# and (t11) the projector menu X50Projector in /system/priv-app (the gear key; its own allow list
# research/allowed_x50projector.tsv, checked by apps/LumenProjector/host/activity/test/run.sh with tools/devices/check_aidl_hal.py and in
# the image by image/verify_tree_x50.py MENU_APP), which also hosts the remote pairing of t10 (the former X50Remote app:
# the original XGIMI RC bonds by itself), and (t17) X50TvInput: the HDMI input app org.lumen.tvinput built from
# devices/g0111/app/X50TvInput.layers (apps/LumenTvInput + the X50 source picker look) in place of the base's Z9xTvInput
# (2026-11-14) LumenUpdater: the shared updater (apps/core/lumen-updater, neutral recipe app/LumenUpdater.layers) in
# /system/app of the public image
# (2026-11-19) Z9xSetup: Lumen Setup of this tree (apps/LumenSetup, shared recipe apps/LumenSetup/app.layers) in place
# of the base's 1.0.9 copy, as the Z9X builds it (image/steps.tsv)
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput Z9xSetup Z9xAirPlay LumenMiracast LumenWifiP2pOverlay LumenKeyboard LumenUpdater LumenPackageInstallerOverlay LumenFiles
