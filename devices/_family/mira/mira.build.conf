# Lumen OS build descriptor, line file: MIRA line (MIRA 4K G0109, MIRA 4K Pro G0110, AURA 3 Max G0104) on the RS30 recipe (devices/g0155/image/steps.tsv). Data only
# (devices/README.md); {codename} is the including model's.
include=devices/_family/rs30/rs30.build.conf
remote_dir={codename}-out
# super group group_oem 4613734400 (the payload's dynamic partition metadata, every firmware of the line) minus the
# largest kept vendor 1460457472, product 65830912 and system_ext 24207360 of v1.3.1
budget=3063238656
blobs=devices/_family/mira/image/mira_blobs_allow.txt
var.ALLOWF=mira_blobs_allow.txt
var.TAGP={codename}
# the official v1.3.1 FULL OTA unpacked on the build host (no dump of a unit): its boot.img is the stock kernel
var.DUMP={env:MIRA_FW|{home}/devices/mira_fw/v131}
var.KBOOT={DUMP}/img/boot.img
