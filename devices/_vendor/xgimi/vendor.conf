# devices/_vendor/xgimi/vendor.conf: what Lumen knows about one projector vendor.
# Read by tools/devices/devices.py (validate), tools/arch/one_projector.py and tools/vendor/extract.py. One key=value
# per line, a list is space separated, '#' starts a comment line.
name=XGIMI
# the property that names the model on a running unit (devices/<c>/device.conf models=)
model_prop=ro.boot.xgimi.modelname
# the HAL families of this vendor: each one is a folder apps/LumenProjector/vendor/xgimi/<family> (the adapter) and a
# value of hal_family= in the descriptors; shared are the parts every family of the vendor may take
families=hidl-gmpf aidl-gmpf play6-hidl mt9681-aidl
shared=gmpf hidl
# stock extraction (tools/vendor/extract.py KIND --vendor xgimi ...): one command per kind, {in} = the official package
# or dump folder, {out} = the output file; none = no tool yet, with the reason in the comment above it
extract.hal-codes=python3 -B tools/hal/hidl_stock.py {in} > {out}
extract.stock-facts=none
extract.menu-tree=none
extract.remotes=none
extract.restore=none
