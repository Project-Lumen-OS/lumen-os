# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
# Its model code H0062 is not a G and four digits: Lumen Installer 1.0.3 refuses the whole catalog.json for such a
# code, so installer_catalog.py writes this entry into catalog-v2.json only (read by 1.0.4 and later). Until
# installer.conf exists (with the h0062 certificates) the entry is trial only on every stock version of device.conf,
# install closed. Trial only, as the RS30: the release ships the trial copy as system_dsu.img (what trial.sh checks),
# signed SHA256SUMS with this model's OTA key.
tag=titanpro-{version}
image=system_dsu.img
certs=devices/h0062/certs/ota.x509.pem devices/h0062/certs/ota_next.x509.pem
