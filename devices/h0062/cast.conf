# Screen casting on the TITAN Noir Pro H0062: data of the one shared feature (AirPlay receiver org.lumen.airplay with the
# casting screen, Miracast sink org.lumen.miracast, DLNA through Lumen Play), read by tools/devices/cast_models.py.
# The model codes and the ABI come from device.conf. Every model has every receiver (2026-11-21: casting is
# one shared feature set on EVERY model), so only real hardware differences live here.
# Stock evidence: xgimi-builder:~/devices/h0062_mt9681/official/v1299/fs/vendor (v1.2.99). Same on every dump read: android.hardware.wifi.direct in
# vendor/etc/permissions/mtv_core_hardware.xml, wpa_supplicant started with -N -ip2p0 -c p2p_supplicant.conf
# (vendor/etc/init/hw/init.common.rc, AIDL supplicant), c2.mtk.avc/hevc.decoder up to 4096x2304 with low-latency.
airplay=1
miracast=1
# offer the 4K (HEVC) mirroring quality: the projector shows 4K and its decoder takes it
mirror_4k=1
