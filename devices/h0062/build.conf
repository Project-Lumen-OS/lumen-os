# Lumen OS build descriptor: XGIMI TITAN Noir Pro (h0062). Data only, read by tools/build/build.py. The X50 family recipe
# (devices/g0111/image/steps.tsv) with this model's identity: own keys, apps and platform set in stage_dir (built and
# signed on the Mac: tools/devices/build_apps.sh h0062, X50_CODENAME=h0062 sign_x50_base.py all and build_home_x50.sh), its
# public certificates (platform.x509.pem = var.PCERT, the APEX FINGERPRINTS.txt), the model props of the stock H0062
# file. Release versions only (trial image, no test variant). The kernel check reads the X50 family kernel of the G0111
# dump: the overseas OTAs V1.2.54 and V1.2.99 have the same kernel and the same 6056 config options
#. Files are dated at the build id (epoch={bidepoch}, as the RS30).
codename=h0062
model=H0062
keys=h0062
ota_channel=none
base=erofs {out}/base/z9x-1.0.9-anp-system.img
base_pin=devices/g0111/image/base.sha256
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector Z9xHome X50TvInput LumenKeyboard
props=devices/h0062/image/h0062_prop_pub.txt devices/h0062/image/h0062_model_prop.txt
overlays=devices/h0062/certs/platform.x509.pem devices/h0062/certs/apex/FINGERPRINTS.txt devices/g0111/image/remove.txt devices/g0111/image/x50_netadb.rc tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc devices/g0111/image/blobs.conf devices/g0111/image/x50_blobs_allow.txt devices/g0111/image/x50_nui.rc apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh apps/X50Projector/image/x50-projector.xml overlay/v1/z9x_setup.rc
tools=devices/g0111/image/compose_x50.sh devices/g0111/image/verify_tree_x50.py devices/g0111/image/x50_props.py devices/g0111/image/x50_apk_check.py devices/g0111/image/x50_kconfig.py devices/g0111/image/x50_power_keys.py devices/g0111/image/x50_perm_pkgs.py devices/g0111/image/x50_diag.py tools/lumen/apkinfo.py tools/erofs_kcheck.py
steps=devices/g0111/image/steps.tsv
host=xgimi-llm
remote_dir=titanpro-out
stage_dir=build/h0062/stage
variants=stage:--stage-only image:--image-only
fs=erofs
pack=erofs -b4096 -zlz4hc -E noinline_data
pack_tool={home}/lumen-builder-backup/lineage-out/host/linux-x86/bin
version=pub:[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(-(beta|rc)[0-9]{1,2})?
options=--stage-only:stage --image-only:image
refuse=stage,image:--stage-only and --image-only do not go together
samples=1.0.10-beta1
# ota (steps.tsv, the update client of the shared X50 steps) stays off: no updater in a TITAN image yet (2026-11-14,
# the installer's TITAN profiles keep the stock vbmeta closed)
flags_off=test ota
tag=titanpro-{v}-pub
build_id=lumen-{PREFIX}-{v}-{bid}
uuid=lumen-x50:{tag}:{bid}:{base_sha256}
epoch={bidepoch}
budget=2500000000
