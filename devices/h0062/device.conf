# Lumen OS device registry: XGIMI TITAN Noir Pro (devices/h0062/README.md). Data only,
# never sourced: tools/devices/devices.py reads it (format and keys in its header).
# The overseas X50 Ultra (newsettings product dianahypro, config folder xgimiconfig/H0062, restore file
# XGIMI_HORSEPOPULAR_XR04EOS.bin) on the same XGIMI firmware line as the X50 Ultra (devices/g0111): the overseas FULL
# OTAs XR03EOS V1.2.54 and V1.2.99 have the same kernel and kernel config, boot ramdisk, fstab, boot HAL, super group and
# partition list as the G0111 1.2.64 dump. It reports ro.product.device horse_popular like the X50, this entry gives
# the pair (horse_popular, H0062) its own name h0062, its own keys and its own image, so no tool takes it for an X50.
# 2026-11-13: not built and not published yet. No unit was read: the install from the trial is check and dry run only
# (apps/LumenDsuInstall Revisions: DRY rows on v1.2.99 and v1.2.54), no installer.conf (no certificates yet), no
# computer installer profile, no OTA. Light level, iris and DLP dynamic black as its stock tree has them (StockLight).
include=devices/_family/titan/titan.device.conf
codename=h0062
name=XGIMI TITAN Noir Pro
models=H0062
# the X50 family's apps live under the X50 Ultra's prefix (apps/X50*), none is TITAN only
app_prefix=X50Titan
channel=titanpro
installer_id=titanpro
