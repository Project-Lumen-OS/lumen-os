# Lumen OS build descriptor: XGIMI Z9X (horse_popular, G0082). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/horse_popular/image/steps.tsv. Built on the Mac only (Z9X artifacts stay
# there): the published release's signed tar (base_pin) patched with the changed members, erofs in a container with
# the LineageOS host tools. stage_dir is the Mac signing step: APKs re-signed with the release keys (~/.lumen-keys,
# read in place), their odex and vdex, and the two build.prop files (devices/horse_popular/image/z9x_props.py).
# A beta (x.y.z-betaN) is the same recipe: tag z9x-x.y.z-betaN, the version code of x.y.z (the Z9X scheme has no
# beta slot, tools/ota/make_manifest.py), its manifest only on the beta channel update-public-beta.json.
codename=horse_popular
model=G0082
keys=~/.lumen-keys
ota_channel=public-nogms
base=tar {BASE_TAR}
base_pin=devices/horse_popular/image/base.sha256
apps=Z9xProjector Z9xHome Z9xUpdater Z9xAirPlay Z9xFrameworkKeysOverlay LumenMiracast LumenDsuInstall LumenWifiP2pOverlay
props=overlay/v1/build_prop_v1.txt overlay/v1/product_prop_v1.txt overlay/v1/z9x_uires/product_prop.txt tools/ota/image/ota_props.txt
overlays=apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/z9x-sysconfig-nogms.xml tools/ota/image/z9x_gapps.sh overlay/v1/z9x_nui.sh overlay/v1/keylayout/Vendor_000d_Product_3838.kl overlay/v1/keylayout/Vendor_000d_Product_3840.kl overlay/v1/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_000d_Product_3842.kl overlay/v1/keylayout/Vendor_000d_Product_3843.kl overlay/v1/keylayout/Vendor_1d5a_Product_c081.kl overlay/v1/keylayout/Vendor_26e3_Product_af02.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl
tools=tools/patch_tar.py tools/erofs_kcheck.py devices/horse_popular/image/z9x_props.py
steps=devices/horse_popular/image/steps.tsv
host=local
root=user
remote_dir=lumen-build-tmp/z9x-build
stage_dir=build/horse_popular/stage
variants=release:
fs=erofs
pack=erofs_tar -b4096 -zlz4hc -E noinline_data -T1230768000
pack_tool=/lineage/out/host/linux-x86/bin
pack_runner=env DOCKER_CONFIG={home}/lumen-build-tmp/r108/dockercfg DOCKER_HOST=unix://{home}/.colima/default/docker.sock docker run --rm --platform linux/amd64 -v {home}/lumen-builder-backup/lineage-out:/lineage/out:ro -v {t}:/work ubuntu:22.04
version=pub:[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2} beta:[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}-beta[1-9][0-9]?
samples=1.0.10 1.0.11-beta1
tag=z9x-{v}
vcode=z9x
vname={v}
build_id={env:BUILD_ID|lumen-{v}-{utcmin}np}
var.REPO={env:LUMEN_REPO|{home}/XGIMI PLAY 6/gsi}
# the certificates check_image.py reads (sign_tar.py --verify needs no private key): a build host without ~/.lumen-keys
# points Z9X_CERTS_DIR at a mode-700 copy of tools/sign/release_certs
var.CERTS={env:Z9X_CERTS_DIR|{home}/.lumen-keys}
var.BASE_TAR={env:Z9X_BASE_TAR|{home}/XGIMI PLAY 6/gsi/build/lumen_v1-1.0.9/system_tv_lumen_v1_public_nogms_signed.tar}
var.tar={t}/system_tv_lumen_v1_public_nogms_signed.tar
var.img={t}/lumen-os-{v}-nogms-system.img
var.MANIFEST=https://github.com/Project-Lumen-OS/lumen-os/releases/download/z9x/update-public-nogms.json
var.INCREMENTAL=eng.root.20261003.104216.lumen10
