# Lumen OS build descriptor: XGIMI Z9X (horse_popular, G0082). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/horse_popular/image/steps.tsv. Built on the Mac only (Z9X artifacts stay
# there): the published release's signed tar (base_pin) patched with the changed members, erofs in a container with
# the LineageOS host tools. stage_dir is the Mac signing step: APKs re-signed with the release keys (~/.lumen-keys,
# read in place), their odex and vdex, and the two build.prop files (devices/horse_popular/image/z9x_props.py).
# A beta (x.y.z-betaN) is the same recipe: tag z9x-x.y.z-betaN, the version code of x.y.z (the Z9X scheme has no
# beta slot, tools/ota/make_manifest.py), its manifest only on the beta channel update-public-beta.json.
codename=horse_popular
model=G0082
keys=~/.lumen-keys
ota_channel=public-nogms
base=tar {BASE_TAR}
base_pin=devices/horse_popular/image/base.sha256
apps=Z9xProjector Z9xHome Z9xSetup Z9xTvInput Z9xUpdater Z9xAirPlay Z9xFrameworkKeysOverlay LumenMiracast LumenDsuInstall LumenWifiP2pOverlay LumenKeyboard LumenPackageInstallerOverlay LumenSystemUIOverlay LumenFiles
# apps that enter the image as their published APK with their own key (devices/_image/prebuilt.tsv)
prebuilt=LumenPlay
props=overlay/v1/build_prop_v1.txt overlay/v1/product_prop_v1.txt overlay/v1/z9x_uires/product_prop.txt tools/ota/image/ota_props.txt
overlays=apps/LumenDsuInstall/image/lumen_dsu_install.rc apps/LumenDsuInstall/image/lumen_dsu_install.sh apps/core/lumen-signal/image/lumen_hdmirx.rc apps/core/lumen-signal/image/lumen_hdmirx.sh tools/ota/image/z9x_blobs.sh tools/ota/image/z9x_blobs.rc tools/ota/image/blobs.conf overlay/v1/z9x_setup.rc overlay/v1/z9x_base.rc overlay/v1/privapp-permissions-lumen-miracast.xml overlay/v1/lumen-miracast-default-permissions.xml overlay/v1/z9x-sysconfig-nogms.xml tools/ota/image/z9x_gapps.sh overlay/v1/z9x_nui.sh overlay/v1/keylayout/Vendor_000d_Product_3838.kl overlay/v1/keylayout/Vendor_000d_Product_3840.kl overlay/v1/keylayout/Vendor_000d_Product_3841.kl overlay/v1/keylayout/Vendor_000d_Product_3842.kl overlay/v1/keylayout/Vendor_000d_Product_3843.kl overlay/v1/keylayout/Vendor_1d5a_Product_c081.kl overlay/v1/keylayout/Vendor_26e3_Product_af02.kl overlay/v1/keylayout/Vendor_3697_Product_0001.kl overlay/v1/keylayout/Vendor_3697_Product_0002.kl devices/horse_popular/image/z9x_model_props.rc devices/horse_popular/image/z9x_model_props.tsv devices/horse_popular/image/z9x_model_prop_dapeng.txt devices/_image/gmsprops/lumen_gmsprops.rc devices/_image/gmsprops/gms_props.conf devices/_image/gmsprops/gmsprops_arm.sha256 devices/_image/gmsprops/gmsprops_arm64.sha256 apps/core/lumen-audio/image/lumen_boot_sound.rc overlay/v1/bootanimation.zip tools/ota/image/z9x_ota.rc tools/ota/image/z9x_ota.sh tools/ota/image/update_verifier.rc tools/ota/image/z9x_rescue.rc tools/ota/image/z9x_rescue.sh overlay/v1/z9x_uires/z9x_uires.sh overlay/v1/z9x_uires/init.lineage.atv.scaling.rc tools/ota/image/blobs_allow.txt tools/ota/image/xgimi_compat_public.rc tools/ota/image/z9x_gapps.rc tools/ota/image/gapps_allow.txt overlay/v1/z9x_pwm_early.rc
tools=tools/patch_tar.py tools/erofs_kcheck.py devices/horse_popular/image/z9x_props.py tools/devices/model_props.py devices/g0111/image/x50_props.py
steps=devices/horse_popular/image/steps.tsv
host=local
root=user
remote_dir=lumen-build-tmp/z9x-build
stage_dir=build/horse_popular/stage
variants=release:
fs=erofs
pack=erofs_tar -b4096 -zlz4hc -E noinline_data -T1230768000
pack_tool=/lineage/out/host/linux-x86/bin
pack_runner=env DOCKER_CONFIG={home}/lumen-build-tmp/r108/dockercfg DOCKER_HOST=unix://{home}/.colima/default/docker.sock docker run --rm --platform linux/amd64 -v {home}/lumen-builder-backup/lineage-out:/lineage/out:ro -v {t}:/work ubuntu:22.04
version=pub:[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2} beta:[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}-beta[1-9][0-9]?
samples=1.0.10 1.0.11-beta1
tag=z9x-{v}
vcode=z9x
vname={v}
build_id={env:BUILD_ID|lumen-{v}-{utcmin}np}
var.REPO={env:LUMEN_REPO|{home}/XGIMI PLAY 6/gsi}
# the certificates check_image.py reads (sign_tar.py --verify needs no private key): a build host without ~/.lumen-keys
# points Z9X_CERTS_DIR at a mode-700 copy of tools/sign/release_certs
var.CERTS={env:Z9X_CERTS_DIR|{home}/.lumen-keys}
var.BASE_TAR={env:Z9X_BASE_TAR|{home}/XGIMI PLAY 6/gsi/build/lumen_v1-1.0.9/system_tv_lumen_v1_public_nogms_signed.tar}
var.tar={t}/system_tv_lumen_v1_public_nogms_signed.tar
var.img={t}/lumen-os-{v}-nogms-system.img
var.MANIFEST=https://github.com/Project-Lumen-OS/lumen-os/releases/download/z9x/update-public-nogms.json
var.INCREMENTAL=eng.root.20261003.104216.lumen10
# the stock Z9X dumps on the Mac that hold vendor/etc/xgimimodelname/G0082/build.prop, one per vendor firmware of
# z9x_model_props.tsv (model_props.py check proves the prop file against each pinned stock file before the rc is added)
var.Z19={env:Z9X_STOCK_V61519|{home}/XGIMI PLAY 6/z9x-firmware-dump/v61519/files19}
var.Z58={env:Z9X_STOCK_V61558|{home}/XGIMI PLAY 6/z9x-firmware-dump/analysis}
var.Z62={env:Z9X_STOCK_V61562|{home}/XGIMI PLAY 6/z9x-firmware-dump/v61562}
# the Wi-Fi APEX with lineage/patches/wifi/0001 (Mac build artifact)
built=build/wifi_apex/arm64/com.android.wifi.capex build/wifi_apex/arm64/service-wifi.odex build/wifi_apex/arm64/service-wifi.vdex
var.WIFI_APEX_SHA=97f942dc2cc1911ac5e6cd0c314c2c0d52e044e9356b5f84477023a51f614274
# its service-wifi.jar dexpreopted as the base build does (tools/base_patch/wifi_dexpreopt.sh, proven on the base jar):
# a missing odex makes the first start compile it before early-boot (z9x-installfail-1128)
var.WIFI_ODEX_SHA=751c241d08d0ed69040bc1c52ed90f0114ff816692794c5481ca3dcfde551eb9
var.WIFI_VDEX_SHA=683a088c08f33bebd5b4dbc4d7b794bea30dde71997d23110018ad73cbfe522c
# the separator of dexpreopt file names (apex<AT>module<AT>javalib<AT>jar<AT>classes): check_publish.py reads a
# literal one as an e-mail address
var.AT=@
# the base's services.jar fix (tools/base_patch/framework.tsv)
framework=z9x
