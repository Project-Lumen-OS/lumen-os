# devices/horse_popular/wallcolor.conf: the stock wall colour adaptation of G0082 (apps/core/lumen-wallcolor README.md), in the
# projector app as assets/lumen_wallcolor/model.conf. Stock: G0082 V6.15.62 xgimiconfig/G0082 feature/feature.xml, camera/camera.ini, xlab/AutoColor.ini.
model=G0082
# feature.xml support_wall_color_adjust_type (the pattern) and support_ambient_light (the card text)
type=3
ambient_light=false
# the vendor's camera, opened by the vendor itself through V4L2 (Lumen never opens it for this feature)
camera=CameraType 8, icSpring 32e6:9005 UVC 640x480 (camera.ini GX-VGA-A291), node usb1/1-3/1-3:1.0/video4linux; Android sees it as camera 104 under Lumen
# the stock vendor calls (codes in this model's hal/codes.tsv) and the event the flow follows
hal=IGmpf2 53 setAEOnOff, IGmpf 106 startAutoColor, IGmpf 99 setAutoColorCalibration, IGmpf 100 setAutoColorDefault; events IGmpf 306 focus listener, type 11001
