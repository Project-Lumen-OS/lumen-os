# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
tag=z9x-{version}
image=lumen-os-{version}-nogms-system.img
stable_manifest=https://github.com/Project-Lumen-OS/lumen-os/releases/download/z9x/update-public-nogms.json
beta_manifest=https://github.com/Project-Lumen-OS/lumen-os/releases/download/z9x/update-public-beta.json
leftovers_cleared_from=1.0.11-beta3
# The way back (Settings > About > Back to the XGIMI system, apps/core/lumen-about): the file name the XGIMI recovery
# USB stick needs, the official XGIMI files (version:size in bytes:address, sizes read from XGIMI's server) and per
# model the stock versions with the official version each goes back with: its own, else a newer one, never an
# older one (installer_catalog.py refuses it). V6.15.58 sits only in XGIMI's debug tree, so it goes back with the
# newer release V6.15.62.
restore_file=XGIMI_HORSEPOPULAR_XR03D.bin
restore_files=v6.15.19:2589266736:https://product-library.static.xgimi.com/firmware/release/MTK9681/dapengend/MTK9681_LEO_6.15.19_20251014-012201/XGIMI_HORSEPOPULAR_XR03D.bin v6.15.62:2656047920:https://product-library.static.xgimi.com/firmware/release/MTK9681/dapengend/MTK9681_LEO_6.15.62_20260325-154151/XGIMI_HORSEPOPULAR_XR03D.bin
restore_stock=G0082:v6.15.19>v6.15.19,v6.15.58>v6.15.62,v6.15.62>v6.15.62
