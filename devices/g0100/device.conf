# Lumen OS device registry: XGIMI X50 Ultra Max (devices/g0100/README.md). Data only,
# never sourced: tools/devices/devices.py reads it (format and keys in its header).
# The same XGIMI firmware build as the X50 Ultra (devices/g0111): XR03E = XR04E (equal md5 and size at 1.2.54 and
# 1.2.64), the model chosen at boot from xgimiconfig/G0100. It reports ro.product.device horse_popular like the Z9X and
# the X50 Ultra; this entry gives the pair (horse_popular, G0100) its own name g0100, its own keys and its own image, so
# no tool takes it for the Z9X or for the X50 Ultra.
# 2026-11-11 (maintainer): public BETA, TRIAL ONLY. The image of the X50 Ultra (t20 content) composed for this model
# (devices/g0111/image/compose_x50.sh with X50_CODENAME=g0100); the install from the trial stays refused
# (apps/LumenDsuInstall Profile.X50MAX, trial only) until a dump of a real Ultra Max is checked. No installer profile
# (the computer installer refuses the model), no OTA. The light level and the DLP dynamic black stay off on it
# (apps/X50Projector Menu.laserRows: other laser currents, DLP and FPGA images in xgimiconfig/G0100/dlp).
codename=g0100
family=horse_popular
status=supported
name=XGIMI X50 Ultra Max
models=G0100
platform=mt5877
hardware=mt9681
abi=arm64
base_product=lumen-image z9x-1.0.9
vendor_sdk=34
# v1.2.54 (2026-11-11): the same kernel, boot ramdisk, gsid and vendor init as
# v1.2.64; its gmpf hash ecadd76e (the v1.2.64 table without DisplayManager 217..223) and its own eye-protection
# pair are accepted only on that firmware (HashRule, alt= lines of the blobs allow-list)
vendor_firmware=v1.2.64 v1.2.54
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
install_flow=ab-fastbootd
ota_engine=none
ota_wire_id=none
prop_namespace=ro.lumen
keys_dir=~/.lumen-keys/g0100
# the X50 family's apps live under the X50 Ultra's prefix (apps/X50*); none is Ultra Max only
app_prefix=X50Max
channel=x50max
installer_id=x50max
fastboot_product=mt5877
# the X50 family's table of deliberate copies (the same apps as the X50 Ultra: X50TvInput's source picker)
forks=devices/g0111/forks.tsv
# the same apps and the same HAL rules as the X50 Ultra (one firmware build, the same AIDL codes and hash)
hal_check=aidl-table
hal_app=apps/X50EyeGuard
hal_codes=devices/g0111/research/aidl_codes.tsv
hal_codes_also=devices/g0111/research/aidl_codes_v1254.tsv
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/g0111/research/allowed_x50eyeguard.tsv
hal_more=apps/X50Projector:devices/g0111/research/allowed_x50projector.tsv
# the maintainer's t20 exceptions of the menu (keystone reset 11, lens shift 88, auto focus 3 after a zoom), as on the Ultra
hal_unbanned=apps/X50Projector:devices/g0100/research/unbanned_x50projector.tsv
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput
