# Lumen OS device registry: XGIMI TITAN Noir Max (devices/h0063/README.md).
# Data only, never sourced: tools/devices/devices.py reads it (format and keys in its header).
# The overseas X50 Ultra Max (newsettings product dianahymax, config folder xgimiconfig/H0063, update file
# XGIMI_HORSEPOPULAR_XR03EOS.bin) on the very XGIMI build of the TITAN Noir Pro (devices/h0062): the official overseas
# FULL OTAs XR03EOS V1.2.54 and V1.2.99 carry both models, the model chosen at boot from xgimiconfig/<model>. Its laser
# current tables are the Ultra Max's (current.ini = G0100's, current01.ini its own). It reports ro.product.device
# horse_popular like the X50, this entry gives the pair (horse_popular, H0063) its own name h0063, its own keys and its
# own image, so no tool takes it for another model.
# 2026-11-13: trial image only, not published. No unit was read: the install from the trial is check and dry run only
# (apps/LumenDsuInstall Revisions: DRY rows on v1.2.99 and v1.2.54), no installer.conf, no computer installer profile,
# no OTA. Light level, iris and DLP dynamic black as its stock tree has them (apps/X50Projector StockLight).
codename=h0063
family=horse_popular
status=supported
name=XGIMI TITAN Noir Max
models=H0063
platform=mt5877
hardware=mt9681
abi=arm64
base_product=lumen-image z9x-1.0.9
vendor_sdk=34
# v1.2.99 (2026-09-07, the newest overseas build) and v1.2.54: gmpf hash ad74d059 (the X50 v1.2.64 table plus 20
# appended methods) on v1.2.99 and the X50 v1.2.54 hash ecadd76e on v1.2.54, each accepted only on that firmware
# (org.lumen.hal.GmpfHash.TITAN_RULE, the TITAN Noir Pro's: one build)
vendor_firmware=v1.2.99 v1.2.54
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
install_flow=ab-fastbootd
ota_engine=none
ota_wire_id=none
prop_namespace=ro.lumen
keys_dir=~/.lumen-keys/h0063
# the X50 family's apps live under the X50 Ultra's prefix (apps/X50*), none is TITAN only
app_prefix=X50TitanMax
channel=titanmax
installer_id=titanmax
fastboot_product=mt5877
# the X50 family's table of deliberate copies (the same apps as the X50 Ultra)
forks=devices/g0111/forks.tsv
# the same apps and the same HAL rules as the X50 Ultra, every call must be the same row in the X50 v1.2.64 and v1.2.54
# tables and in the TITAN v1.2.99 table
hal_check=aidl-table
hal_app=apps/X50EyeGuard
hal_codes=devices/g0111/research/aidl_codes.tsv
hal_codes_also=devices/g0111/research/aidl_codes_v1254.tsv devices/h0062/research/aidl_codes_v1299.tsv
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/g0111/research/allowed_x50eyeguard.tsv
hal_more=apps/X50Projector:devices/g0111/research/allowed_x50projector.tsv
# the maintainer's t20 exceptions of the menu (keystone reset 11, lens shift 88, auto focus 3 after a zoom), as on the Ultra
hal_unbanned=apps/X50Projector:devices/h0063/research/unbanned_x50projector.tsv
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput Z9xSetup LumenKeyboard LumenPackageInstallerOverlay
