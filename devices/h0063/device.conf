# Lumen OS device registry: XGIMI TITAN Noir Max (devices/h0063/README.md).
# Data only, never sourced: tools/devices/devices.py reads it (format and keys in its header).
# The overseas X50 Ultra Max (newsettings product dianahymax, config folder xgimiconfig/H0063, update file
# XGIMI_HORSEPOPULAR_XR03EOS.bin) on the very XGIMI build of the TITAN Noir Pro (devices/h0062): the official overseas
# FULL OTAs XR03EOS V1.2.54 and V1.2.99 carry both models, the model chosen at boot from xgimiconfig/<model>. Its laser
# current tables are the Ultra Max's (current.ini = G0100's, current01.ini its own). It reports ro.product.device
# horse_popular like the X50, this entry gives the pair (horse_popular, H0063) its own name h0063, its own keys and its
# own image, so no tool takes it for another model.
# 2026-11-13: trial image only, not published. No unit was read: the install from the trial is check and dry run only
# (apps/LumenDsuInstall Revisions: DRY rows on v1.2.99 and v1.2.54), no installer.conf, no computer installer profile,
# no OTA. Light level, iris and DLP dynamic black as its stock tree has them (apps/LumenProjector/host/activity StockLight).
include=devices/_family/titan/titan.device.conf
codename=h0063
name=XGIMI TITAN Noir Max
models=H0063
# the X50 family's apps live under the X50 Ultra's prefix (apps/X50*), none is TITAN only
app_prefix=X50TitanMax
channel=titanmax
installer_id=titanmax
