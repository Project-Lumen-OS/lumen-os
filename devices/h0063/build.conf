# Lumen OS build descriptor: XGIMI TITAN Noir Max (h0063). Data only, read by tools/build/build.py. The X50 family recipe
# (devices/g0111/image/steps.tsv) with this model's identity: own keys, apps and platform set in stage_dir (built and
# signed on the Mac: tools/devices/build_apps.sh h0063, X50_CODENAME=h0063 sign_x50_base.py all and build_home_x50.sh), its
# public certificates (platform.x509.pem = var.PCERT, the APEX FINGERPRINTS.txt), the model props of the stock H0063
# file. Release versions only (trial image, no test variant). The kernel check reads the X50 family kernel of the G0111
# dump: the overseas OTAs V1.2.54 and V1.2.99 have the same kernel and the same 6056 config options
#. Files are dated at the build id (epoch={bidepoch}, as the RS30).
