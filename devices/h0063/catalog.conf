# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
# Its model code H0063 is not a G and four digits: Lumen Installer 1.0.3 refuses the whole catalog.json for such a
# code, so installer_catalog.py writes this entry into catalog-v2.json only (read by 1.0.4 and later). Until
# installer.conf exists (with the h0063 certificates) the entry is trial only on every stock version of device.conf,
# install closed. Trial only, as the RS30: the release ships the trial copy as system_dsu.img (what trial.sh checks),
# signed SHA256SUMS with this model's OTA key.
tag=titanmax-{version}
image=system_dsu.img
certs=devices/h0063/certs/ota.x509.pem devices/h0063/certs/ota_next.x509.pem
# the way back (Settings > About > Back to the XGIMI system, lumen-os.net/restore): the official overseas v1.2.99 file
# of this model on XGIMI's firmware server, downloaded in full 2026-11-21 (md5 = ETag c7f8f1a7200860b63aa7c61131bc4207,
# sha256 0863e149...42cea4fc, the same bytes under all three TITAN names). v1.2.54 has no file there.
# v1.3.38: the overseas file of the build of 2026-11-16 (folder MTK9681_DOHKO_1.3.38_20261116-213152, 2734101008 B,
# plain ETag 4921e560c39548b4982b72ae012ddfcc, the same object under all three TITAN names; its FULL OTA zip was
# downloaded on xgimi-llm, md5 = ETag 453bfd0e..., gsi-research/H0063_FW_1.3.38.md).
restore_file=XGIMI_HORSEPOPULAR_XR03EOS.bin
restore_files=v1.2.99:2519405360:https://product-library.static.xgimi.com/firmware/release/MTK9681/dianahy/MTK9681_DOHKO_1.2.99_20260907-104602/XGIMI_HORSEPOPULAR_XR03EOS.bin v1.3.38:2734101008:https://product-library.static.xgimi.com/firmware/release/MTK9681/dianahy/MTK9681_DOHKO_1.3.38_20261116-213152/XGIMI_HORSEPOPULAR_XR03EOS.bin
restore_stock=H0063:v1.2.99>v1.2.99,v1.3.38>v1.3.38
