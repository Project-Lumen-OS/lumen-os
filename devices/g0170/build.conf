# Lumen OS build descriptor: XGIMI RS30 Ultra (g0170, G0170). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/g0155/image/steps.tsv, the RS30 recipe of the G0155 with this model's files and
# identity (the vars below). Trial images only (rs30ultra-tN-net).
# Base: the RS30 base of the G0155 (its own arm32 LineageOS 21 lineage_gsi_tv_arm built with uffd GC on builder-llm,
# the design notes), pinned in devices/g0155/image/base.sha256, AOSP test keys. stage_dir: the Mac's sign
# output (tools/devices/sign_device.py g0170 all: the base's platform set on the g0170 platform key and the registry
# apps built by build_apps.sh g0170), never a key. Variants: net = the trial image (needs the stage), unsigned = the
# same tree without the stage (base test keys, no Lumen app: a build check of the host side, never for a unit). The
# apps are the G0155 ones: Lumen Home, Lumen Setup, screen mirroring, AirPlay, keyboard, files and Lumen Play.
include=devices/_family/rs30/rs30.build.conf
codename=g0170
model=G0170
blobs=devices/g0170/image/g0170_blobs_allow.txt
remote_dir=rs30ultra-out
# super group group_oem 4613734400 (the v1.2.5 FULL OTA payload's dynamic partition metadata) minus the kept vendor
# 1485750272, product 65830912 and system_ext 24252416 of v1.2.5
budget=3037900800
# the full dump of a unit on stock v1.2.5 (xgimi-llm ~/devices/g0170_mt9681/dump, LumenDump of 2026-11-21): its
# active slot equals the official v1.2.5 FULL OTA byte for byte (devices/g0170/research/stock_v125.tsv)
var.DUMP={env:G0170_DUMP|{home}/devices/g0170_mt9681/dump}
# the model's own files and identity in the shared RS30 recipe (devices/g0155/image/steps.tsv)
var.TAGP=rs30ultra
var.NAME=XGIMI RS30 Ultra Highlight
var.MODEL=G0170
var.PRODUCT=Product_athena35ultrahl
var.ALLOWF=g0170_blobs_allow.txt
# the stock kernel: var.KBOOT of the RS30 family, the boot partition of this dump (the same bytes as boot.img of
# XGIMI_HORSEPOPULAR_XR07C_FULL_V1.2.5.zip, sha256 647af2bd...23cc)
