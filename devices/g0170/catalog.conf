# Lumen Installer catalog (tools/devices/installer_catalog.py): where the Lumen OS builds of this projector are
# published. The builds themselves come from the releases (newest stable, newest beta). Data only.
# Trial only, as the RS30 Ultra Max G0155: no update channel, no install for good; the release ships the trial image as
# system_dsu.img (what trial.sh checks), SHA256SUMS signed with this model's OTA key.
tag=rs30ultra-{version}
image=system_dsu.img
certs=devices/g0170/certs/ota.x509.pem devices/g0170/certs/ota_next.x509.pem
# The way back (Settings > About > Back to the XGIMI system): the official XGIMI file of its own stock v1.2.5, the
# model's UpdateBinName (xgimiconfig G0170 system.ini XR07C) in the folder of that build (the RS30 3.5 line build sits
# in the athenathirtyfivepro project; built 2026-11-12 17:38:12 CST, the unit's ro.build.date; the same object as XR04C2).
restore_file=XGIMI_HORSEPOPULAR_XR07C.bin
restore_files=v1.2.5:2414220032:https://product-library.static.xgimi.com/firmware/release/MTK9681/athenathirtyfivepro/MTK9681_DOHKO_1.2.5_20261112-171555/XGIMI_HORSEPOPULAR_XR07C.bin
restore_stock=G0170:v1.2.5>v1.2.5
