# Lumen OS device registry: XGIMI RS30 Ultra 高亮版 (high brightness edition, G0170, Lumen codename g0170;
# devices/g0170/README.md). Data only, never sourced: tools/devices/devices.py reads it
# (format and keys in its header).
# The RS30 3.5 line of the MT9681 horse_popular image (the model chosen at boot from ro.boot.xgimi.modelname): its own
# XGIMI build branch MT9681_YDN3.5_2-3Q_MP, whose v1.2.5 xgimiconfig carries G0157, G0167, G0168 and G0170 next to the
# X50, TITAN and Z9X folders but no G0155 (the G0155 v1.1.42 build is another branch). It reports ro.product.device
# horse_popular too. This entry gives the pair (horse_popular, G0170) its own name g0170, its own keys
# and its own image. First stock read: a Lumen Installer report of 2026-11-21 (stock v1.2.5, ro.build.date Thu Nov 12
# 17:38:12 CST 2026, branch MT9681_YDN3.5_2-3Q_MP_20260729, Product_athena35ultrahl, board mt9681, 32-bit userspace
# armeabi-v7a only, kernel 5.15.192, VNDK 34). The G0155 data with its own identity: the same arm32 base and recipe,
# the X50 family apps, its own stock settings tree (athena35ultrahl = the athena35ultramax tree with the single iris,
# motion compensation without the original frame and the warm colour temperature).
# TRIAL ONLY, as the G0155: no computer installer profile, no install for good, no OTA, no release channel.
