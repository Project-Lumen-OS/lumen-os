# devices/g0155/wallcolor.conf: the stock wall colour adaptation of G0155 (apps/core/lumen-wallcolor README.md), in the
# projector app as assets/lumen_wallcolor/model.conf. Stock: G0155 V1.1.42 xgimiconfig/G0155 feature/feature.xml, camera/camera.ini, xlab/AutoColor.ini.
model=G0155
# feature.xml support_wall_color_adjust_type (the pattern) and support_ambient_light (the card text)
# stock type 5 has no pattern of its own in SystemUI release_848: it falls back to the type 1 picture (white start disc)
type=5
ambient_light=true
# the vendor's camera, opened by the vendor itself through V4L2 (Lumen never opens it for this feature)
camera=CameraType 6, 1280x720, node usb1/1-3/1-3:1.0/video4linux
# the stock vendor calls (codes in this model's hal/codes.tsv) and the event the flow follows
hal=DisplayManager 150 setAEOnOff, 108 startAutoColor, 115 setAutoColorCalibration, 114 setAutoColorDefault; events ProjectorFocusManager 1 setFocusCallback, type 11001
