# Lumen OS device registry: XGIMI RS30 Ultra Max 旗舰版 (devices/g0155/README.md). Data
# only, never sourced: tools/devices/devices.py reads it (format and keys in its header).
# Its firmware is built from the same XGIMI product image as the Z9X (G0082) and the X50 Ultra (G0111), so it
# reports ro.product.device horse_popular too; devices/horse_popular is the Z9X, devices/g0111 the X50. This entry
# gives the pair (horse_popular, G0155) its own name g0155, its own keys and its own image, so no tool takes it for
# either of them. Stock dump 2026-11-07 (builder-llm ~/devices/g0155_mt9681): v1.1.42, ro.build.date Wed Oct 7
# 13:52:50 CST 2026, branch MT9681_YDN3.5_RS30UltraMax_OTA_Release_20260925, Product_athena35ultramax, board mt9681,
# 32-bit userspace (zygote32, armeabi-v7a only) on an arm64 5.15 kernel with CONFIG_USERFAULTFD=y, VNDK 34.
# 2026-11-12: TEST IMAGES ONLY (trial). The X50 apps run on it unchanged: every HAL code they send is the same on its
# stock table (devices/g0111/hal/codes.tsv proves each row against devices/g0155/research/aidl_codes.tsv too); only the
# interface hash differs (org.lumen.hal.GmpfModel). Its menu offers only what its stock settings tree has (menu.json).
# Lumen OS reaches it only as a trial (2026-11-12): no computer installer profile, no install for good, no OTA,
# no release channel. No verified G0155 restore file exists yet.
codename=g0155
family=horse_popular
status=supported
name=XGIMI RS30 Ultra Max
models=G0155
platform=mt5877
hardware=mt9681
# 32-bit userspace (zygote32, armeabi-v7a only): its image can never be the arm64 Z9X 1.0.9 image the X50 uses
abi=arm32
# its own arm32 base: LineageOS 21 lineage_gsi_tv_arm from lineage/manifests/lumen-lineage-21.xml with the HB / Play 6
# patches (lineage/patches/play6) and the Codec2 store patch, built WITH uffd GC
base_product=lineage_gsi_tv_arm uffd
vendor_sdk=34
vendor_firmware=v1.1.42
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
# the ab-fastbootd way of the X50 and the HB; its fastbootd has no USB (recovery mtu3_dev_en=0, no usb_otg_agent),
# so a unit gets Lumen OS only from the trial (DSU), as the X50
install_flow=ab-fastbootd
ota_engine=none
ota_wire_id=none
prop_namespace=ro.lumen
# the RS30's own platform and OTA keys (tools/devices/gen_device_keys.sh g0155); public certificates in
# devices/g0155/certs, private keys only on the maintainer's Mac
keys_dir=~/.lumen-keys/g0155
# the X50 family's apps (apps/X50*) under its own recipes (devices/g0155/app); none is RS30 only
app_prefix=Rs30
channel=none
installer_id=rs30
# expected, unverified: its fastbootd answers product mt5877 like the Z9X and the X50 (never enough to tell them apart)
fastboot_product=mt5877
forks=devices/g0111/forks.tsv
hal_check=aidl-table
hal_app=apps/X50EyeGuard
hal_codes=devices/g0155/research/aidl_codes.tsv
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/g0111/research/allowed_x50eyeguard.tsv
hal_more=apps/X50Projector:devices/g0111/research/allowed_x50projector.tsv
# the maintainer's t20 exceptions of the X50 menu (keystone reset 11, lens shift 88, auto focus 3 after a zoom): this stock
# sends the same calls with the same values (newsettings v1.1.42 KeyStoneManager 225 autoFocus((byte) 47), 261-327
# setLowConfigureKeyStoneValue(50) and setTiltShiftMove(13, 0f); tree nodes reset_keystone, zoom_and_optical_shift)
hal_unbanned=apps/X50Projector:devices/g0155/research/unbanned_x50projector.tsv
apps=X50EyeGuard X50PowerOverlay X50Projector X50TvInput
