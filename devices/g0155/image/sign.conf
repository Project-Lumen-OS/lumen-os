# What tools/devices/sign_device.py signs for the XGIMI RS30 Ultra Max (g0155). Data only, format and keys as
# devices/goat_elegant/image/sign.conf. The base is its own arm32 LineageOS 21 TV build on builder-llm
# (devices/g0155/image/BASE.md), on the AOSP test keys like the HB base: the platform set moves to the g0155
# platform key, the APEXes keep the base build's own module test keys.
base_image_remote=rs30-base/out/target/product/generic/system.img
base_sha256=devices/g0155/image/base.sha256
base_dir=build/g0155/base_platform
# no Lumen APK of overlay/apps_v1 in this image: its apps are the registry's (device.conf apps, build_apps.sh)
pinned=none
host_bin_remote=rs30-base/out/host/linux-x86/bin
module_keys_remote=rs30-base/src/packages/modules
apex_work_remote=rs30-out/apex_sign
stage=build/g0155/signed_stage
test_keys_remote=rs30-base/src/build/make/target/product/security
