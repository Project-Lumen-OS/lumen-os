# Lumen OS build descriptor: XGIMI RS30 Ultra Max (g0155). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/g0155/image/steps.tsv. Test images only (rs30-tN-net, trial only).
# Base: its own arm32 LineageOS 21 lineage_gsi_tv_arm built with uffd GC on builder-llm, pinned in
# image/base.sha256, AOSP test keys. stage_dir: the Mac's sign output (tools/devices/sign_device.py g0155 all: the
# base's platform set on the g0155 platform key and the registry apps built by build_apps.sh g0155), never a key.
# Variants: net = the trial image (needs the stage), unsigned = the same tree without the stage (base test keys, no
# Lumen app: a build check of the host side, never for a unit).
codename=g0155
model=G0155
keys=g0155
ota_channel=none
base=ext4 {BASE}/out/target/product/generic/system.img
base_pin=devices/g0155/image/base.sha256
