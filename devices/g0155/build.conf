# Lumen OS build descriptor: XGIMI RS30 Ultra Max Flagship (g0155). Data only, read by tools/build/build.py
# (tools/build/README.md); steps devices/g0155/image/steps.tsv. Test images only (rs30-tN-net, trial only).
# Base: its own arm32 LineageOS 21 lineage_gsi_tv_arm built with uffd GC on builder-llm, pinned in
# image/base.sha256, AOSP test keys. stage_dir: the Mac's sign output (tools/devices/sign_device.py g0155 all: the
# base's platform set on the g0155 platform key and the registry apps built by build_apps.sh g0155), never a key.
# Variants: net = the trial image (needs the stage), unsigned = the same tree without the stage (base test keys, no
# Lumen app: a build check of the host side, never for a unit). Since t3 the image also carries the shared apps of the
# other Lumen images: Lumen Home (the one HOME), screen mirroring (LumenMiracast + LumenWifiP2pOverlay) and AirPlay
# (since 2026-11-21 built from this tree with the casting screen, signed_stage/apps). Since beta3 Lumen Setup (Z9xSetup) runs the first start and
# provisions the device, as on the X50, the HB and the Play 6 (TvProvision goes in the signed variants).
include=devices/_family/rs30/rs30.build.conf
codename=g0155
model=G0155
blobs=devices/g0155/image/rs30_blobs_allow.txt
remote_dir=rs30-out
# super group 4613734400 minus the kept vendor, product and system_ext of v1.1.42 (partitions)
budget=3104694272
var.DUMP={env:RS30_DUMP|{home}/devices/g0155_mt9681/dump}
# the model's own files and identity in the shared RS30 recipe (devices/g0155/image/steps.tsv)
var.TAGP=rs30
var.NAME=XGIMI RS30 Ultra Max Flagship
var.MODEL=G0155
var.PRODUCT=Product_athena35ultramax
var.ALLOWF=rs30_blobs_allow.txt
