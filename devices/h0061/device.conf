# Lumen OS device registry: XGIMI TITAN Noir (devices/h0061/README.md). Data only,
# never sourced: tools/devices/devices.py reads it (format and keys in its header).
# The overseas sibling of the TITAN Noir Pro (devices/h0062) on the very same XGIMI build: newsettings product dianahy,
# config folder xgimiconfig/H0061, restore file XGIMI_HORSEPOPULAR_XR06EOS.bin (on the XGIMI download server the same
# bytes as the XR03EOS and XR04EOS files of V1.2.99). The official overseas FULL OTAs XR03EOS V1.2.54 and V1.2.99 carry
# H0061, H0062 and H0063, the model chosen at boot from xgimiconfig/<model>; H0061 has the Pro's feature.xml, keypad and
# settings tree byte for byte, its own light engine tables (dlp.ini, no DLP flash image, no per colour space calibration
# LUTs) and light level 3 as the stock default. It reports ro.product.device horse_popular like the X50, this entry gives
# the pair (horse_popular, H0061) its own name h0061, its own keys and its own image, so no tool takes it for another model.
# 2026-11-19: trial only. No unit was read: the install from the trial is check and dry run only (apps/LumenDsuInstall
# Revisions: DRY rows on v1.2.99 and v1.2.54), no installer.conf, no computer installer profile, no OTA. Light level,
# iris and DLP dynamic black as its stock tree has them (apps/X50Projector StockLight).
codename=h0061
family=horse_popular
status=supported
name=XGIMI TITAN Noir
models=H0061
platform=mt5877
hardware=mt9681
abi=arm64
base_product=lumen-image z9x-1.0.9
vendor_sdk=34
# v1.2.99 (2026-09-07, the newest overseas build) and v1.2.54: gmpf hash ad74d059 (the X50 v1.2.64 table plus 20
# appended methods) on v1.2.99 and the X50 v1.2.54 hash ecadd76e on v1.2.54, each accepted only on that firmware
# (org.lumen.hal.GmpfHash.TITAN_RULE, the TITAN Noir Pro's: one build)
vendor_firmware=v1.2.99 v1.2.54
hal_transport=aidl
image_fs=erofs
slots=ab-virtual
install_flow=ab-fastbootd
ota_engine=none
ota_wire_id=none
prop_namespace=ro.lumen
keys_dir=~/.lumen-keys/h0061
# the X50 family's apps live under the X50 Ultra's prefix (apps/X50*), none is TITAN only
app_prefix=X50TitanNoir
channel=titannoir
installer_id=titannoir
fastboot_product=mt5877
# the X50 family's table of deliberate copies (the same apps as the X50 Ultra)
forks=devices/g0111/forks.tsv
# the same apps and the same HAL rules as the X50 Ultra, every call must be the same row in the X50 v1.2.64 and v1.2.54
# tables and in the TITAN v1.2.99 table
hal_check=aidl-table
hal_app=apps/X50EyeGuard
hal_codes=devices/g0111/research/aidl_codes.tsv
hal_codes_also=devices/g0111/research/aidl_codes_v1254.tsv devices/h0062/research/aidl_codes_v1299.tsv
hal_banned=devices/goat_elegant/research/banned.tsv
hal_allowed=devices/g0111/research/allowed_x50eyeguard.tsv
hal_more=apps/X50Projector:devices/g0111/research/allowed_x50projector.tsv
# the maintainer's t20 exceptions of the menu (keystone reset 11, lens shift 88, auto focus 3 after a zoom), as on the Ultra
hal_unbanned=apps/X50Projector:devices/h0061/research/unbanned_x50projector.tsv
apps=X50EyeGuard X50PowerOverlay LumenDsuInstall X50Projector X50TvInput Z9xSetup LumenKeyboard LumenPackageInstallerOverlay
