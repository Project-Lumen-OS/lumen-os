# Lumen OS on the XGIMI Z9X (G0082): the settings of the one blobs reader /system/etc/z9x/z9x_blobs.sh
# (tools/ota/image/z9x_blobs.sh, every key explained there), image path /system/etc/z9x/blobs.conf. Data only.
# The Z9X's 4 MiB z9x_blobs with the nine codec / audio files of blobs_allow.txt, no eye-protection group. A trial
# run reads them from the stock slot, whose VNDK APEX is a com.android.vndk.current.apex file (Android 14).
tag=z9x_blobs
allow=blobs_allow.txt
blocks=64
tmpfs=8m
maxf=4194304
eye=0
src_partition=0
stock_apex=zip
