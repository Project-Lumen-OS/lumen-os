# The *-cow partitions the PC installer deletes in fastbootd: the leftovers of a finished Virtual A/B update.
# Read (never sourced) by lumen-install.sh (cow_load) and lumen-install.ps1 (Cow-Load). tools/devices/test:
# cow_rules_parity.py checks these values and how both installers use them, installer_cow_rules.sh and .ps1 run both
# installers on cow_cases.tsv. A *-cow is a leftover when fastbootd's snapshot-update-status is <status>, its name is <base><suffix>
# with <base> ending in the running slot (_a/_b), and 'getvar all' lists <base> with a size. Any other *-cow: STOP.
#
# libsnapshot's suffix of a COW partition
suffix=-cow
# the partition a COW partition belongs to, whole name, case-sensitive (fastbootd's names are lowercase)
base=[a-z0-9_]+
# fastbootd's snapshot-update-status (the boot HAL's merge status) with no update staged or merging
status=none
