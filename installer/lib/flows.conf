# SPDX-License-Identifier: Apache-2.0
# Lumen OS installer: the ways a projector is installed, one per FLOW of lib/devices.conf. Both lumen-install.sh and
# lumen-install.ps1 read it the same way; what each step does is the code of that flow, what may be written stays in
# fb_allowed / Fb-Allowed. Data only: parsed strictly, never run.
# Lines: flow.KEY=value (flow: a-z 0-9 -; KEY: A-Z 0-9 _). A value holds only letters, digits, spaces and . _ : / , -
# Keys: KEYS (what lib/devices.conf must give a projector of this flow), STATE (root: its progress is
# $STATE_DIR/state, the folders of the other projectors next to it; own: $STATE_DIR/<id>/state), START (a step every
# command of this flow runs first), CMD_<COMMAND> (the step of a command, CMD_ALL without one: a function name as
# lumen-install.sh writes it, lumen-install.ps1 calls the same words as Abc-Def, then its arguments), TOOLS (the
# commands that start the installer's own adb and fastboot first), NOT_NEEDED and NOT_YET (commands this flow refuses,
# with a 'not needed' or a 'not available yet' message), NEEDS (command:KEY, refused as not available yet when the
# projector's profile has no KEY). A command this file does not name is unknown.
z9x-usb.KEYS=MODEL BOARD FB_PRODUCT VENDOR_OK CERT VERSION_PROP GUIDE
z9x-usb.STATE=root
z9x-usb.CMD_ALL=cmd_all
z9x-usb.CMD_CHECK=cmd_check
z9x-usb.CMD_BACKUP=cmd_backup
z9x-usb.CMD_BLOBS=cmd_blobs
z9x-usb.CMD_VBMETA=cmd_vbmeta
z9x-usb.CMD_FLASH=cmd_flash
z9x-usb.CMD_VERIFY=cmd_verify
z9x-usb.CMD_GSF=cmd_gsf
z9x-usb.CMD_GAPPS=cmd_gapps
z9x-usb.CMD_STICK=stick_check
z9x-usb.TOOLS=all check backup blobs vbmeta flash verify gsf gapps
play6-wifi.KEYS=MODEL BOARD FB_PRODUCT VENDOR_OK CERT IMAGE_TOKEN IMAGE_FS VERSION_PROP LUMEN_PROP LOGICAL SUPER_RESERVE
play6-wifi.STATE=own
play6-wifi.CMD_ALL=play6_all
play6-wifi.CMD_CHECK=play6_check
play6-wifi.CMD_BACKUP=cmd_backup
play6-wifi.CMD_FLASH=play6_flash
play6-wifi.CMD_VERIFY=play6_verify 60
play6-wifi.CMD_STICK=stick_check
play6-wifi.CMD_GAPPS=play6_gapps
play6-wifi.CMD_GSF=play6_gsf
play6-wifi.NOT_NEEDED=blobs vbmeta
play6-wifi.TOOLS=all check backup flash verify gsf gapps
ab-fastbootd.KEYS=MODEL BOARD FB_PRODUCT VENDOR_OK CERT IMAGE_TOKEN IMAGE_FS VERSION_PROP LUMEN_PROP LOGICAL SUPER_RESERVE
ab-fastbootd.STATE=own
ab-fastbootd.START=abf_main
ab-fastbootd.CMD_ALL=abf_all
ab-fastbootd.CMD_CHECK=abf_check
ab-fastbootd.CMD_BACKUP=cmd_backup
ab-fastbootd.CMD_VBMETA=abf_vbmeta
ab-fastbootd.CMD_BLOBS=abf_blobs
ab-fastbootd.CMD_FLASH=abf_flash
ab-fastbootd.CMD_VERIFY=abf_verify
ab-fastbootd.CMD_GAPPS=abf_gapps
ab-fastbootd.CMD_GSF=abf_gsf
ab-fastbootd.NOT_YET=stick
ab-fastbootd.NEEDS=gapps:GAPPS_ALLOW gsf:GAPPS_ALLOW
ab-fastbootd.TOOLS=all check backup blobs flash verify gapps gsf
