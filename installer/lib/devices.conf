# Lumen OS installer: the projectors it knows. What a projector IS lives here, which commands its way of installing
# has in lib/flows.conf; what the installer DOES (its steps, and the only partitions it may write) stays in
# lumen-install.sh and lumen-install.ps1, so this file can never widen what is written. A new projector on a known
# way is one more block here, no code. Data only: both scripts parse it strictly and never run it.
# Lines: id.KEY=value (id: a-z 0-9; KEY: A-Z 0-9 _). A value holds only letters, digits, spaces and . _ : / , -
# Keys: NAME (shown to the user), MODEL (ro.boot.xgimi.modelname), BOARD (ro.boot.hardware), FB_PRODUCT
# (fastbootd 'product'), VENDOR_OK (XGIMI firmware versions, ro.vendor.build.version.incremental; the first
# one is the recommended one), CERT (checks SHA256SUMS.sig), IMAGE_TOKEN (part of the image file name),
# IMAGE_FS, VERSION_PROP, LUMEN_PROP (a property and its value on a running Lumen OS for this projector),
# LOGICAL (the logical partitions of super), SUPER_RESERVE (bytes of super kept free for its metadata),
# GUIDE (its guide: docs/install/<GUIDE>/<language>.md), RESTORE_BIN and RESTORE_MD5 (md5:version of XGIMI's
# known stock firmware files, checked by 'stick'), RESTORE_URL (optional: version:URL of the official file of each
# RESTORE_MD5 version, shown where the installer names the way back). The Play 6 lists VENDOR_OK oldest first: the
# .bin of its last one is the way back for the newer batch, and the only firmware with XGIMI's own AIC driver.
# FLOW: how it is installed, a flow of lib/flows.conf (its commands, and the keys above it needs): z9x-usb (adb and
# fastbootd over USB), play6-wifi (adb over Wi-Fi, fastboot mode over a USB A-to-A cable, single slot) or
# ab-fastbootd: a virtual A/B projector with stock adb
# over the network, written in fastbootd over a USB A-to-A cable. Its keys, all required with FLOW=ab-fastbootd: SLOTS (the
# slots a write may go to; the running slot must be one of them), KEEP (logical partitions that must exist and
# are never touched), WIPE_PARTS (formatted with 'fastboot format:<WIPE_FS>' after the write, never erased; only
# userdata and metadata are accepted), SYSTEM_MAX (largest system image in bytes, the budget of super),
# BLOBS_ALLOW (its blobs allow-list, a path in the installer folder). Optional with FLOW=ab-fastbootd, both or neither:
# GAPPS_ALLOW (its Google services add-on allow-list, the same file as the image's /system/etc/z9x/gapps_allow.txt)
# and GAPPS_IMAGES (the add-on images checked for it), paths in the installer folder; without them 'gapps', 'gsf'
# and --gapps-zip are not there for that projector. Optional with FLOW=ab-fastbootd: BLOBS_SIZE (its z9x_blobs partition in
# bytes, whole MiB from 4 to 64 MiB; without it 4 MiB). An allow-list with need=eye lines (files the image's
# eye-protection drawer needs, from the user's own projector) makes --no-blobs and --blobs=embedded impossible for
# that projector, and a need=eye file that does not match stops the install.
# FAMILY (optional, instead of FB_PRODUCT): the id of the projector whose XGIMI product image this one shares, so
# that its fastbootd answers that projector's 'product' (its FB_PRODUCT is used; that projector has no FAMILY
# itself). Such projectors are told apart only by MODEL and BOARD over adb (ro.boot.xgimi.modelname,
# ro.boot.hardware), then by the serial number in fastbootd: never by the product, ro.product.device or the board
# platform, which they share.
# SLOT_CHECK (optional with FLOW=ab-fastbootd and RESTORE_BIN, only 'yes'): XGIMI ships the other slot's logical partitions empty
# while its boot loader keeps that slot bootable. Before the first write of a visit the installer shows the other
# slot's state and, when that slot holds no system, says what a fall to it means and asks; after system it reads the
# slots again (still the written slot, not unbootable, the other slot as before, else STOP before the wipe) and tells
# a written slot that lost its successful mark. Read only: it never writes the other slot or switches slots.
# WIPE_FS (optional with FLOW=ab-fastbootd: ext4, the default, or f2fs): the file system WIPE_PARTS get, the one the projector's
# stock fstab mounts on /data and /metadata (fs_mgr never reformats a partition that holds another file system, so a
# wrong type leaves /data unmounted and Android does not start). f2fs: userdata with casefold and projid (the vendor's
# external_storage.casefold / projid), metadata plain, as the Z9X way does it; it needs make_f2fs next to fastboot.
# MODELS_OK (optional with FLOW=ab-fastbootd; then PRODUCT_NAMES, DEVICE and MODEL_CONFIG too): one projector sold under several
# model codes on one XGIMI build, as a table 'MODEL:firmware,firmware MODEL2:firmware' (ro.boot.xgimi.modelname,
# ro.vendor.build.version.incremental): a model may be installed only on the firmware of its own entry. MODEL is
# its first model (older readers), VENDOR_OK every firmware of the table. PRODUCT_NAMES 'MODEL:product ...': the
# stock ro.vendor.xgimi.product.name of each model (another one = the firmware of another model, a cross-flash).
# DEVICE: the stock ro.product.device. MODEL_CONFIG: the folder of the stock per-model configs; the projector must
# have MODEL_CONFIG/<model>/system.ini. MODELS_NOT_YET (optional): model codes of that projector that are refused as
# not supported yet (named as such, never as another projector). All read only, over adb, before anything else.
# MODELS_CHECK_ONLY (optional with MODELS_OK): models of MODELS_OK that are not written yet (their support is in
# testing): 'check' and 'blobs' pass and say so, 'flash', 'all' and 'gapps' stop before anything is written. It mirrors
# the live switch of the installers that run on the projector itself (a check and a dry run only); the host tests keep
# them equal. Remove a model only after its live test.
# ABI (optional with FLOW=ab-fastbootd: arm32 or arm64): the userspace of the projector's stock vendor. With dump.erofs
# the image's ro.system.product.cpu.abilist must be that one (arm64: it lists arm64-v8a, arm32: armeabi-v7a and no
# arm64-v8a), else STOP: a system of the other ABI never starts on that vendor.
# TODO (only with FLOW=ab-fastbootd, only as the value of VENDOR_OK, LOGICAL, KEEP, SYSTEM_MAX, BLOBS_ALLOW, BLOBS_SIZE
# or RESTORE_BIN, written TODO:<what decides it>): a fact the port of a new projector does not have yet. A profile with
# a TODO value is not finished: 'check' reads the projector and the image (identity, signature, what the image says
# about itself) and then STOPs, every other command STOPs before adb or fastboot. Nothing is ever written to such a
# projector, and another projector's installer names it as not supported yet.
# The scripts name no projector: each one is a block of this file, its steps are those of its FLOW.
# The Z9X: v6.15.19 (2025-10-14) has the same kernel, modules, projector HAL (gmpf) and PM51 firmware as v6.15.58, only
# hwcomposer, libwhitebalance and XGIMI apps differ (z9x-firmware-dump/v61519, 2026-10-08). v6.15.62 (2026-03-25, the
# current firmware of the Z9X 4K flagship variant): the same kernel, gmpf, HALs, init, SELinux, VINTF, blobs and PM51
# firmware as v6.15.58, libxgimi.so the same size, only rebuilt files differ (a 4PDA user's dumps, 2026-10-13 / 14).
z9x.NAME=XGIMI Z9X
z9x.MODEL=G0082
z9x.BOARD=mt9952
z9x.FB_PRODUCT=mt5877
z9x.VENDOR_OK=v6.15.58 v6.15.62 v6.15.19
z9x.CERT=certs/ota.x509.pem
z9x.VERSION_PROP=ro.z9x.version
z9x.GUIDE=z9x
z9x.FLOW=z9x-usb
play6.NAME=XGIMI Play 6
play6.MODEL=G0058
play6.BOARD=mt5889
play6.FB_PRODUCT=mt5889
play6.VENDOR_OK=v1.7.116 v1.8.127
play6.CERT=certs/play6/ota.x509.pem
play6.IMAGE_TOKEN=play6
play6.IMAGE_FS=ext4
play6.VERSION_PROP=ro.lumen.version
play6.LUMEN_PROP=ro.lumen.device play6
play6.LOGICAL=system vendor
play6.SUPER_RESERVE=4194304
play6.GUIDE=play6
play6.RESTORE_BIN=XGIMI_DRAGONHEALTHY_XN03C.bin
play6.RESTORE_MD5=55ae66ed7e14a20759ea4b9d5686d591:V1.7.116 a14277a6c73676487a7de5ede36dc017:V1.8.127
play6.RESTORE_URL=V1.7.116:https://product-library.static.xgimi.com/firmware/release/MTK9270/dayao/MTK9270_APHRODIT_1.7.116_20251125-162039/XGIMI_DRAGONHEALTHY_XN03C.bin V1.8.127:https://product-library.static.xgimi.com/firmware/release/MTK9270/dayao/MTK9270_APHRODIT_1.8.127_20260410-175145/XGIMI_DRAGONHEALTHY_XN03C.bin
play6.FLOW=play6-wifi
hb.NAME=XGIMI Z9X HB
# The Z9X HB is sold as G0118, G0130 and G0148 on one XGIMI build (goat_elegant, mt9660; one USB file
# XGIMI_GOATELEGANT_XR03D.bin for all): the design notes. G0130 on V6.16.24 and V6.17.12, G0148
# on V6.17.12 only (V6.16.24 has no G0148 settings: a G0148 on it is cross-flashed), G0118 not yet (no dump). 6.18.x
# is the GMUI launcher version, never a firmware. SYSTEM_MAX: the group maximum of super (3460300800) minus vendor,
# product and system_ext of the larger V6.17.12 stock (1376321536, 59371520, 3338240), the smaller of the two.
hb.MODEL=G0130
hb.BOARD=mt9660
hb.FB_PRODUCT=mt5873
hb.VENDOR_OK=v6.16.24 v6.17.12
hb.MODELS_OK=G0130:v6.16.24,v6.17.12 G0148:v6.17.12
hb.PRODUCT_NAMES=G0130:Product_dapengse G0148:Product_dapengfhm
hb.DEVICE=goat_elegant
hb.MODEL_CONFIG=/mnt/vendor/xgimiconfig
hb.MODELS_NOT_YET=G0118
# MODELS_CHECK_ONLY (models in testing: check and blobs only) is empty: the G0148 on V6.17.12 installs since the maintainer's
# decision of 2026-11-11 (public HB beta 1.0.10-beta9, before a live G0148 test; it was check only from 2026-11-10)
hb.CERT=certs/hb/ota.x509.pem
hb.IMAGE_TOKEN=hb
hb.IMAGE_FS=erofs
hb.VERSION_PROP=ro.lumen.version
hb.LUMEN_PROP=ro.lumen.device goat_elegant
hb.LOGICAL=system vendor product system_ext
hb.SUPER_RESERVE=4194304
hb.GUIDE=hb
hb.FLOW=ab-fastbootd
hb.SLOTS=a b
hb.KEEP=vendor product system_ext
hb.WIPE_PARTS=userdata metadata
hb.SYSTEM_MAX=2021269504
hb.BLOBS_ALLOW=lib/hb/blobs_allow.txt
hb.GAPPS_ALLOW=lib/hb/gapps_allow.txt
hb.GAPPS_IMAGES=lib/hb/gapps_images.txt
# The XGIMI X50 Ultra runs XGIMI's horse_popular product image like the XGIMI Z9X (ro.product.device, the board
# platform and its fastbootd 'product' are the same as the Z9X's): only its model G0111 and board mt9681 tell it
# from the Z9X G0082 / mt9952, its own certificate checks its images, and its stock restore file is
# XGIMI_HORSEPOPULAR_XR04E.bin (the Z9X's is XR03D; 'stick' is not there yet for this projector). The stock
# product and system_ext stay (KEEP): the image mounts its own (skip_mount.cfg), as on the HB. SYSTEM_MAX: the
# group maximum of super (4613734400) minus vendor, product and system_ext of the stock dump (1543102464,
# 131313664, 33144832). Its z9x_blobs partition is 16 MiB: the codec files and the stock eye-protection drawer.
# Its stock leaves slot b empty (system_b, vendor_b, product_b, system_ext_b of size 0 in lpdump) while misc keeps
# slot b bootable (priority 14, 3 tries): SLOT_CHECK. Its stock fstab mounts /data and /metadata as f2fs
# (devices/g0111/research/data_fs.tsv; the HB's are ext4): WIPE_FS.
x50.NAME=XGIMI X50 Ultra
x50.MODEL=G0111
x50.BOARD=mt9681
x50.FAMILY=z9x
x50.VENDOR_OK=v1.2.64 v1.2.54
x50.CERT=certs/x50/ota.x509.pem
x50.IMAGE_TOKEN=x50
x50.IMAGE_FS=erofs
x50.VERSION_PROP=ro.lumen.version
x50.LUMEN_PROP=ro.lumen.device g0111
x50.LOGICAL=system vendor product system_ext
x50.SUPER_RESERVE=4194304
x50.GUIDE=x50
x50.RESTORE_BIN=XGIMI_HORSEPOPULAR_XR04E.bin
x50.FLOW=ab-fastbootd
x50.SLOTS=a b
x50.KEEP=vendor product system_ext
x50.WIPE_PARTS=userdata metadata
x50.SYSTEM_MAX=2906173440
x50.BLOBS_ALLOW=lib/x50/blobs_allow.txt
x50.BLOBS_SIZE=16777216
x50.SLOT_CHECK=yes
x50.WIPE_FS=f2fs
