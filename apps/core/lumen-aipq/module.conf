# lumen-aipq: the AI picture quality of stock XGIMI XRMService (utils/AIPQ.java) for every projector app: the core
# (AiPq, plain Java), its HAL calls as one interface per projector family (AiPqVendor) and the Android side (AiPqDriver:
# the receivers, the video monitor, one lock). Used by the projector apps only (Z9xProjector, HbProjector,
# Play6Projector, X50Projector), so no other app carries it. Source module, no library: tools/devices/assemble_app.py
# copies it into the app tree.
name=lumen-aipq
package=org.lumen.aipq
