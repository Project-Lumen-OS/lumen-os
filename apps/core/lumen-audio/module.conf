# lumen-audio: the media route rules of every Lumen projector, the stock volume split (StockVolume over the model's
# chip table), the one vendor path switch (PathSwitch), the one ordered writer of the HAL sink (HalSink) and the
# Bluetooth device of an output choice (BtA2dp) (Z9X, Z9X HB, Play 6, X50 Ultra / Ultra Max / RS30): the
# vendor path a media route really plays on (MediaPath), HDMI ARC / eARC kept out of the media route while Auto
# plays on a personal output (ArcAside) and the CEC System Audio of an output choice (SoundbarMode: choosing the
# soundbar always asks it back to the TV input). Source module, no library: tools/devices/assemble_app.py copies it into the
# app tree before apps/build_apk.sh runs.
name=lumen-audio
package=org.lumen.audio
