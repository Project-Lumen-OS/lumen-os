# lumen-system: the Android settings screens Lumen apps open (SettingsPage), each as one chain of ways best first
# (SystemIntent) and one opener that starts the first way some app handles (SystemPages). Shared by the projector menu
# (apps/core/lumen-menu: the Bluetooth and Network tiles) and the first-run app (Z9xSetup, HbSetup: the remote step).
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-system
package=org.lumen.system
