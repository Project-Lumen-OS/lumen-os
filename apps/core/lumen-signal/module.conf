# lumen-signal: the signal panel of every Lumen projector (README.md): a small card in the top right corner with the
# input signal, a second press (or OK held on the card, CardHold over lumen-remote KeyHook) opens the full panel on the
# right side, a third press hides it. Opened by the remote's
# Shortcut key (lumen-remote, devices/_remotes/keys.tsv unbound=signal) and by the round signal button of the quick
# menu (lumen-menu FeatureId.SIGNAL_PANEL, a module screen). Each projector app gives one SignalReader over its own
# HAL client; which rows a model has is data (devices/<c>/signal.tsv, in the app as assets/lumen_signal/items.tsv).
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-signal
package=org.lumen.signal
depends=lumen-icons lumen-ui lumen-remote
