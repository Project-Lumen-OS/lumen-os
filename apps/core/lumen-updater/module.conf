# lumen-updater: the ONE updater of every Lumen projector (org.lumen.updater, "Lumen OS update"; 2026-11-13):
# channel manifests and their signatures, download, checks, the install through update_engine or the recovery, the
# update screen and its TvSettings entry, the boot result, statistics. A model is data: its recipe adds one
# src/org/lumen/updater/Target.java (an UpdateTarget) and its AndroidManifest.xml. README.md has the model table.
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
# body=yes: the module is the whole app, so it keeps the app's own resource names (assemble_app.py rule 7b).
name=lumen-updater
package=org.lumen.updater
packages=org.lumen.common
depends=lumen-stats lumen-icons lumen-qr
body=yes
