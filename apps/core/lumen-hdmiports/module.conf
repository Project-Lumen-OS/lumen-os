# lumen-hdmiports: the one HDMI port state of every Lumen app (Home chips, the menu's HDMI page, the Source key).
# The state is made in one place, org.lumen.tvinput PortState (the port's +5V as the framework reports the HDMI
# hotplug, the CEC source on it, our own sessions), and served by its hdmi_state provider; this module only reads
# it, so no app decides on its own whether a port is connected. A CEC name is an extra label, never the state.
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-hdmiports
package=org.lumen.hdmiports
