# lumen-wallcolor: the stock wall colour adaptation of every projector whose stock has it (README.md): the menu card,
# the test pattern the vendor measures through its camera, the result bar and the save question, driven by the vendor's
# focus event 11001. Each projector app gives one WallColorHal over its own HAL client (the four stock vendor calls)
# and routes its focus events to WallColor.onFocusEvent; the model's data is devices/<c>/wallcolor.conf, in the app as
# assets/lumen_wallcolor/model.conf. Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-wallcolor
package=org.lumen.wallcolor
depends=lumen-ui lumen-remote
