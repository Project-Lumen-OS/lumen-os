# lumen-menu: the ONE projector menu of every Lumen projector: quick panel D and the game menu, driven
# by devices/<codename>/menu.json and a small device adapter (org.lumen.menu.ProjectorFeatures). Source module, no
# library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-menu
package=org.lumen.menu
depends=lumen-about lumen-qr lumen-parental lumen-icons lumen-system lumen-report lumen-signal lumen-sensors lumen-audio lumen-ui lumen-wallcolor lumen-remote lumen-common-strings lumen-hdmiports lumen-source
packages=org.lumen.menu.utils org.lumen.menu.sound org.lumen.menu.quick org.lumen.projector.panel org.lumen.projector.ui
