# lumen-menu: the ONE projector menu of every Lumen projector: quick panel D and the game menu, driven
# by devices/<codename>/menu.json and a small device adapter (org.lumen.menu.ProjectorFeatures). Source module, no
# library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-menu
package=org.lumen.menu
packages=org.lumen.projector.panel org.lumen.projector.ui
