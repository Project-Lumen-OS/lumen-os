# lumen-about: the XGIMI side of the projector in the system Settings About page, the same on every projector (README.md):
# the rows Model code, XGIMI firmware and Back to the XGIMI system (AboutProvider, which TvSettings' About page asks
# through the base_patch fix tvsettings_about) and the screen Back to the XGIMI system (XgimiSystemActivity: the USB
# stick file name and the official XGIMI file from Lumen Installer's signed catalog, with its QR code). Read only.
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-about
package=org.lumen.about
depends=lumen-qr
