# lumen-gmpf: the one client of XGIMI's gmpf vendor HAL for every projector built on the Z9X app (Z9X: HIDL IGmpf /
# IGmpf2, Z9X HB: stable AIDL services). org.lumen.hal.gmpf is the call layer (operations, the device code table, the
# transport contract, the device rules, the zoom guard); the shared client bodies GmpfBase / Gmpf2Base go into the
# app's hal package next to the device clients that extend them. Source module, no library: tools/devices/assemble_app.py
# copies it into the app tree.
name=lumen-gmpf
package=org.lumen.hal.gmpf
packages=org.lumen.hal.gmpf.utils org.lumen.projector.hal
