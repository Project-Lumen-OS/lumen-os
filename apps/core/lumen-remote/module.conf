# lumen-remote: the ONE remote pairing of every Lumen projector (README.md): scan and bond any XGIMI remote of the
# remote table (devices/_remotes/remotes.tsv, generated into RemoteCatalog) and, when the user asks, any Bluetooth LE
# HID remote or keyboard; automatic pairing when a remote is put into pairing mode, HID connect, reconnect after a
# reboot, battery level, the remote-lost prompt. Each projector app gives one small RemoteHost (setup events, boot
# reason, its own prompt blockers). Package keys: "Remote buttons", a remote or keyboard key given an app (README.md).
# Source module, no library: tools/devices/assemble_app.py copies it into the app.
name=lumen-remote
package=org.lumen.remote
packages=org.lumen.remote.keys
depends=lumen-ui lumen-common-strings
