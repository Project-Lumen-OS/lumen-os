# lumen-sensors: the developer overlays of every Lumen projector (README.md), built on the signal panel's overlay look:
# the sensor card (temperatures, light source, distance to the wall, motion sensor, processor and memory) and the
# diagnostics sheet. Opened from All settings, General, For developers (lumen-menu module screens) and by a remote key
# given the action in Remote buttons. Each projector app gives one SensorReader over its own HAL client; which rows a
# model has is data (devices/<c>/sensors.tsv, in the app as assets/lumen_sensors/items.tsv).
name=lumen-sensors
package=org.lumen.sensors
depends=lumen-icons lumen-ui lumen-signal lumen-remote
