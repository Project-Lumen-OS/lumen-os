# lumen-files-access: all files access and the overlay app op for trusted apps on every Lumen projector (README.md).
# Lumen Play (com.xgimiru.player, in every image as its published APK and updated from GitHub over it) gets the app
# ops MANAGE_EXTERNAL_STORAGE (subtitles next to videos on USB sticks) and SYSTEM_ALERT_WINDOW (videos from a phone
# or a browser open while it is in the background) and the media read permissions it asks for (no "Music and audio"
# or "Photos and videos" prompt) once its signing certificate is our release key, on install, on update and once per
# start. The projector app runs it (FilesAccessStart). Source module, no library:
# tools/devices/assemble_app.py copies it into the app tree.
name=lumen-files-access
package=org.lumen.filesaccess
