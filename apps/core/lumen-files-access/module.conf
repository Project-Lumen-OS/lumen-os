# lumen-files-access: all files access for trusted user apps on every Lumen projector (README.md). Lumen Play
# (com.xgimiru.player) updates itself from GitHub as a normal user app, so the system side gives it the app op
# MANAGE_EXTERNAL_STORAGE (subtitles next to videos on USB sticks) once its signing certificate is our release key,
# on install, on update and once per start. The projector app runs it (FilesAccessStart). Source module, no library:
# tools/devices/assemble_app.py copies it into the app tree.
name=lumen-files-access
package=org.lumen.filesaccess
