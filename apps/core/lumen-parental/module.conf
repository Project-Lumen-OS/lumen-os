# lumen-parental: the parental controls of every Lumen projector whose stock firmware has XGIMI's parent page
# (Z9X, Z9X HB, X50 Ultra, Ultra Max, RS30 Ultra Max, Play 6; not TITAN): child lock with a remote arrow key password,
# control range (child mode only or everywhere), time per session and per day with the stock 10 minute rest, password at
# power on, child mode at power on, the apps of child mode, the forgotten password question. Hosted by Lumen Home (its
# app list, launches and boot), opened from the projector menu's General row (MenuSpec SETTINGS_PARENTAL, intent
# org.lumen.parental.SETTINGS). Source module: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-parental
package=org.lumen.parental
depends=lumen-icons lumen-common-strings
