# lumen-control: the command core of every Lumen projector (gsi-research design "one window": commands once, thin
# protocol adapters on top, one small driver per host below). First adapter: the stock XGIMI phone remote
# (org.lumen.control.vcontrol: LAN discovery, connect, heartbeat and the remote's commands of com.xgimi.vcontrol),
# answered from the projector app with the model's stock values (devices/_control/vcontrol.tsv). Source module, no
# library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-control
package=org.lumen.control
packages=org.lumen.control.android org.lumen.control.ucontrol org.lumen.control.utils org.lumen.control.vcontrol
depends=lumen-stats
