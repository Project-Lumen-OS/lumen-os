# lumen-report: the problem reports of every Lumen projector (README.md): the screen "Send a problem report" (shared
# menu row General > Send a problem report, lumen-menu FeatureId.SETTINGS_REPORT), automatic reports of crashes,
# freezes and failed starts of the system and of Lumen apps (ReportService, ReportBoot), the queue and the upload to
# our report server (tools/stats/server/lumen_reports.py). Personal data is removed on the projector (Scrubber,
# LogcatFilter, PropFilter). Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-report
package=org.lumen.report
depends=lumen-icons lumen-common-strings lumen-ui
