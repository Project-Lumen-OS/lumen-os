# lumen-download: the ONE download of large files of every Lumen app (README.md): several resumable HTTP range
# connections at once, the GitHub CDN link renewed when refused, If-Range with the ETag. Plain Java, no Android: the
# updater (OTA packages, apps/core/lumen-updater) and Lumen Installer (trial images, app updates) name it in their
# recipes, tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-download
package=org.lumen.download
