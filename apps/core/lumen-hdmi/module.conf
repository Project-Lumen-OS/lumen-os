# lumen-hdmi: the HDMI link rules of every projector app (HdmiLink, plain Java: the signal status, the game profile
# gate, the relink decision and the EDID flip), the stock HDMI mode rows (EdidModes, plain Java) and the HDMI relink
# itself (HdmiRelink, Android: one EDID flip when a powered CEC source gives no picture), over one small per-model
# RelinkHost (its HAL thread, codes and stock EDID values). Used by Z9xProjector, HbProjector and the X50 family X50Projector. Source module, no library:
# tools/devices/assemble_app.py copies it into the app tree.
name=lumen-hdmi
package=org.lumen.hdmi
