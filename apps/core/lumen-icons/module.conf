# lumen-icons: the ONE icon set of every Lumen app (README.md): Material Symbols Rounded as vector drawables
# (res/drawable/lumen_ic_*.xml, generated by tools/icons/gen_icons.py from the pinned official source), their state
# tints, and the small helpers that put them into rows, hints and switches (org.lumen.icons). Source module, no
# library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-icons
package=org.lumen.icons
