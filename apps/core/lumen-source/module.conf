# lumen-source: the remote's Source key on every Lumen projector, as on XGIMI stock (gsi-stock analysis):
# each press goes straight to the next input (Home -> first connected HDMI -> next HDMI -> Home) and a small card at
# the top left names what is on screen now. Presses while the card is up go on from the last step and change the
# text in place. Called by every projector app's key receiver and by its Source request receiver; the per model
# difference is data (devices/<c>/source.tsv, in the app as assets/lumen_source/source.tsv).
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-source
package=org.lumen.source
depends=lumen-icons lumen-ui lumen-common-strings lumen-hdmiports
