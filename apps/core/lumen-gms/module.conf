# lumen-gms: the Lumen side of the Google sign-in helper (lineage/gmsprops, private stock analysis).
# GmsHelperPolicy (pure rules: when the row shows, what the switch and a data default write), GmsHelperSwitch (the
# two persist properties the init script lumen_gmsprops.rc and liblumen_gmsprops.so read), GmsHelperRow (row state).
# One module for every model: the menu row and the Google registration screen call it, no model checks.
# Source module, no library: tools/devices/assemble_app.py copies it into the app tree.
name=lumen-gms
package=org.lumen.gms
