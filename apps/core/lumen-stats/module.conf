# lumen-stats: the one anonymous statistics client of every Lumen projector (the server: tools/stats/server). The
# Z9X and HB updaters send through it (their Stats keeps only the updater's storage and notice rule); apps without an
# updater (the projector app of the Play 6, the X50 Ultra / Ultra Max and the RS30) run its StatsJob with its own
# storage. The model comes from the device registry (Models, generated by tools/stats/gen_models.py). Source module,
# no library: tools/devices/assemble_app.py copies it into the app tree before apps/build_apk.sh runs.
name=lumen-stats
package=org.lumen.stats
