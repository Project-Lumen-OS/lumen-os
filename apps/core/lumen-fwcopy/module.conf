# lumen-fwcopy: the XGIMI firmware set of every projector (which partitions XGIMI's own update writes into the other
# half, from each model's stock dump) and the one copy of that set from the running half into the other half (
# decision 2026-11-15). Shared by the in-trial installer (LumenDsuInstall: the copy itself) and the updater (lumen-updater
# Preflight: the list update_engine copies). Source module, no library: each app's app.layers names it
# (tools/devices/assemble_app.py), and the host test suites compile apps/core/lumen-fwcopy/src with their own sources.
name=lumen-fwcopy
package=org.lumen.fwcopy
